<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Catalyst</title>
<style>
  /* Must equal WEBVIEW_CONFIG.splashScreen.backgroundColor so the native layer and this page are one surface */
  :root {
    --ink: #0b0a14;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-io: cubic-bezier(0.65, 0, 0.35, 1);
    --sine: cubic-bezier(0.37, 0, 0.63, 1);
    --t0: 520ms; /* flat hold, set per platform in start() */
  }
  /* Transparent until placed: the identical native image shows through, so the reveal is invisible */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .ready, .ready body { background: var(--ink); }
  #stage { position: fixed; inset: 0; perspective: 760px; visibility: hidden; }
  .ready #stage { visibility: visible; }
  #stage * { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  html:not(.go) #stage *, html:not(.go) #stage *::before { animation-play-state: paused !important; }
  .p3 { transform-style: preserve-3d; }
  canvas { display: block; backface-visibility: visible; }

  /*
    Score at 120 BPM (one beat = 500ms), times after the flat hold:
    0.0  tilt + extrude          1.0  rays break into a two-stage turbine
    2.5  rush back               3.0  SLAM: shockwave, flash, sparks
    3.0  hero turn + scale up    4.0  title flips in, 4.5 tagline
    4.7  calm float until the native 300ms fade
  */
  #lift  { animation: lift 4000ms linear var(--t0) both; }
  #cam   { animation: cam 4000ms linear var(--t0) both; }
  #yaw   { animation: yaw 5200ms var(--sine) calc(var(--t0) + 4700ms) infinite alternate both; }
  #pitch { animation: pitch 3900ms var(--sine) calc(var(--t0) + 4700ms) infinite alternate both; }
  .depth { animation: extrude 700ms cubic-bezier(0.22, 1, 0.36, 1) var(--t0) both; }
  .lit   { animation: fadein 600ms var(--ease-io) calc(var(--t0) + 60ms) both; }
  #shine { opacity: 0; animation: shine 800ms linear calc(var(--t0) + 3650ms) both; }
  #shine i { animation: sweep 800ms cubic-bezier(0.45, 0, 0.3, 1) calc(var(--t0) + 3650ms) both; }
  #glow  { animation: glow 5000ms linear var(--t0) both; }
  #glow canvas { animation: breathe 2600ms var(--sine) calc(var(--t0) + 5000ms) infinite alternate both; }
  #dust  { animation: dust 7000ms linear var(--t0) both; }
  #wave1 { animation: wave 780ms cubic-bezier(0.12, 0.8, 0.3, 1) calc(var(--t0) + 3000ms) both; }
  #wave2 { animation: wave 900ms cubic-bezier(0.12, 0.8, 0.3, 1) calc(var(--t0) + 3090ms) both; }
  #flash { animation: flash 520ms cubic-bezier(0.2, 0.8, 0.3, 1) calc(var(--t0) + 2985ms) both; }
  #tag   { animation: rise 640ms var(--ease-out) calc(var(--t0) + 4500ms) both; }

  @keyframes lift {
    0%, 75% { transform: translate3d(0, 0, 0) scale3d(1, 1, 1); animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1); }
    77%  { transform: translate3d(0, 0, 0) scale3d(1.1, 1.1, 1.1); animation-timing-function: var(--ease-io); }
    81%  { transform: translate3d(0, -4px, 0) scale3d(1.03, 1.03, 1.03); animation-timing-function: cubic-bezier(0.45, 0, 0.2, 1); }
    100% { transform: translate3d(0, -62px, 0) scale3d(1.7, 1.7, 1.7); }
  }
  @keyframes cam {
    0%     { transform: translateZ(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg); animation-timing-function: cubic-bezier(0.55, 0, 0.25, 1); }
    18.75% { transform: translateZ(-36px) rotateX(26deg) rotateY(-48deg) rotateZ(-4deg); animation-timing-function: var(--ease-io); }
    25%    { transform: translateZ(-30px) rotateX(23deg) rotateY(-42deg) rotateZ(-3deg); animation-timing-function: cubic-bezier(0.45, 0, 0.2, 1); }
    40%    { transform: translateZ(-24px) rotateX(10deg) rotateY(-12deg) rotateZ(0deg); animation-timing-function: linear; }
    62.5%  { transform: translateZ(-12px) rotateX(6deg) rotateY(-6deg) rotateZ(0deg); animation-timing-function: cubic-bezier(0.6, 0, 0.95, 0.55); }
    75%    { transform: translateZ(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg); animation-timing-function: cubic-bezier(0.55, 0, 0.12, 1); }
    100%   { transform: translateZ(0) rotateX(0deg) rotateY(360deg) rotateZ(0deg); }
  }
  @keyframes yaw   { from { transform: rotateY(0deg); } to { transform: rotateY(22deg); } }
  @keyframes pitch { from { transform: rotateX(0deg) translate3d(0, 0, 0); } to { transform: rotateX(-6deg) translate3d(0, -4px, 0); } }
  @keyframes extrude { from { transform: scale3d(1, 1, 0.001); } to { transform: scale3d(1, 1, 1); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shine { 0% { opacity: 0; } 25%, 70% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes sweep { from { transform: translate3d(-150px, 0, 0); } to { transform: translate3d(190px, 0, 0); } }
  @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.08); } }
  @keyframes glow {
    0%   { opacity: 0; transform: translate3d(0, 0, 0) scale(1); }
    18%  { opacity: 0.7; transform: translate3d(0, 0, 0) scale(1); }
    50%  { opacity: 0.45; transform: translate3d(0, 0, 0) scale(1.15); }
    59.7%{ opacity: 0.5; transform: translate3d(0, 0, 0) scale(1); animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1); }
    61%  { opacity: 1; transform: translate3d(0, 0, 0) scale(1.25); }
    68%  { opacity: 0.7; transform: translate3d(0, -10px, 0) scale(1.2); }
    80%  { opacity: 0.85; transform: translate3d(0, -62px, 0) scale(1.75); }
    85%  { opacity: 1; transform: translate3d(0, -62px, 0) scale(1.8); }
    90%  { opacity: 0.8; transform: translate3d(0, -62px, 0) scale(1.75); }
    95%  { opacity: 0.95; transform: translate3d(0, -62px, 0) scale(1.8); }
    100% { opacity: 0.85; transform: translate3d(0, -62px, 0) scale(1.75); }
  }
  @keyframes dust {
    0%   { opacity: 0; transform: scale(1); }
    14%  { opacity: 0; }
    24%  { opacity: 0.9; }
    60%  { opacity: 0.75; }
    100% { opacity: 0.5; transform: scale(1.22); }
  }
  @keyframes wave {
    0%   { opacity: 0; transform: scale(0.12); }
    6%   { opacity: 1; }
    100% { opacity: 0; transform: scale(1.7); }
  }
  @keyframes flash {
    0%   { opacity: 0; transform: scale(0.3); }
    10%  { opacity: 1; transform: scale(0.9); }
    100% { opacity: 0; transform: scale(1.5); }
  }
  @keyframes rise { from { opacity: 0; transform: translate3d(0, 10px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
  @keyframes flip {
    from { opacity: 0; transform: translate3d(0, 14px, -30px) rotateX(-100deg); }
    40%  { opacity: 1; }
    to   { opacity: 1; transform: translate3d(0, 0, 0) rotateX(0deg); }
  }

  .ghost, .shade { opacity: 0; }
  /* Promote late-starting layers up front so their first frame is not a raster stall mid-sequence */
  #word span, #tag, .spark, #wave1, #wave2, #flash, #shine, #shine i, #dust, #glow { will-change: transform, opacity; }
  #word {
    width: 100%; text-align: center; perspective: 420px;
    font: 650 36px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, "Segoe UI", system-ui, sans-serif;
    letter-spacing: -0.005em; color: #efeeff; -webkit-font-smoothing: antialiased;
  }
  #word span {
    position: relative; display: inline-block; transform-origin: 50% 85%; backface-visibility: hidden;
    animation: flip 680ms cubic-bezier(0.2, 0.9, 0.25, 1.12) both;
  }
  #tag {
    width: 100%; text-align: center;
    font: 450 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.02em; color: rgba(206, 204, 255, 0.74); -webkit-font-smoothing: antialiased;
  }
  #shine { overflow: hidden; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
  #shine i {
    width: 90px; height: 100%; top: 0;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.10) 30%, rgba(255, 255, 255, 0.62) 50%, rgba(255, 255, 255, 0.10) 70%, rgba(255, 255, 255, 0) 100%);
  }
  .spark {
    height: 2px; border-radius: 1px; transform-origin: 0 50%; opacity: 0;
    background: linear-gradient(90deg, rgba(150, 148, 255, 0), #f4f3ff);
  }

  /* Still mode renders frame 0 only (used to generate the native PNGs) */
  .still, .still body { background: transparent !important; }
  .still #stage *, .still #word span { animation: none !important; }
  .still .depth { transform: scale3d(1, 1, 0.001); }
  .still .lit, .still #glow, .still #word, .still #tag, .still #shine, .still #fx, .still #dust { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    #stage *, #word span { animation: none !important; }
    .depth { transform: scale3d(1, 1, 0.001); }
    .lit, #shine, #fx, #dust { opacity: 0; }
    #glow { animation: fadein 900ms ease calc(var(--t0) + 100ms) both !important; }
    #word, #tag { animation: fadein 700ms ease calc(var(--t0) + 400ms) both !important; }
  }
</style>
</head>

  <div id="fx"></div>
  <div id="word" aria-label="Catalyst"></div>
  <div id="tag">One codebase. Web, iOS and Android.</div>
</div>

    base.appendChild(depth); ray.appendChild(base);

    /* Silhouette eroded by 1.6 device px so the side walls never fringe the front face's anti-aliased edge */
    var sil = layer(0, WALL_RES), sc = sil.ctx;
    trace(sc, pts, dx, dy); sc.fillStyle = '#fff'; sc.fill();
    sc.globalCompositeOperation = 'destination-out'; sc.lineWidth = 3.2; sc.stroke();

    /* Walls: dark violet lit from the upper left, brightening toward the front edge like a bevel.
       The back slice carries a dimmed brand gradient so the hero turn shows a real back face. */
    var deep = [24, 22, 66], mid = [66, 62, 170], edge = [160, 158, 255];
    for (var k = 0; k < SLICES; k++) {
      var f = k / (SLICES - 1);
      var z = -HD + 2 * HD * f * (SLICES - 1) / SLICES;
      var L = layer(z, WALL_RES), ctx = L.ctx;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(sil.c, 0, 0); ctx.setTransform(WALL_RES, 0, 0, WALL_RES, 0, 0);
      ctx.globalCompositeOperation = 'source-in';
      if (k === 0) {
        ctx.fillStyle = brand(ctx, r, dx, dy, 0.55);
      } else {
        var bse = f < 0.8 ? mix(deep, mid, Math.pow(f / 0.8, 1.6)) : mix(mid, edge, Math.pow((f - 0.8) / 0.2, 2));
        var lg = ctx.createLinearGradient((40 - CX) * K + dx, (10 - CY) * K + dy, (150 - CX) * K + dx, (175 - CY) * K + dy);
        lg.addColorStop(0, rgb(mix(bse, [255, 255, 255], 0.16)));
        lg.addColorStop(1, rgb(mix(bse, [0, 0, 0], 0.35)));
        ctx.fillStyle = lg;
      }
      ctx.fillRect(0, 0, w, h);
      depth.appendChild(L.c);
    }

    /* Front face at native resolution: the exact flat mark the native PNG shows */
    var fr = layer(HD, 1);
    trace(fr.ctx, pts, dx, dy); fr.ctx.fillStyle = brand(fr.ctx, r, dx, dy); fr.ctx.fill();
    depth.appendChild(fr.c);

    /* Lit front at hero resolution: soft bevel, highlight upper-left, shade lower-right */
    function litFace(z) {
      var lt = layer(z, HERO), lc = lt.ctx, R = HERO;
      trace(lc, pts, dx, dy); lc.fillStyle = brand(lc, r, dx, dy); lc.fill();
      lc.save(); trace(lc, pts, dx, dy); lc.clip();
      function inner(color, ox2, oy2, blur) {
        lc.save();
        /* shadows ignore the canvas transform, so scale them by hand */
        lc.shadowColor = color; lc.shadowBlur = blur * R; lc.shadowOffsetX = ox2 * R; lc.shadowOffsetY = oy2 * R;
        lc.beginPath(); lc.rect(-w, -h, 3 * w, 3 * h);
        for (var j = pts.length - 1; j >= 0; j--) { var x = (pts[j][0] - CX) * K + dx, y = (pts[j][1] - CY) * K + dy; j === pts.length - 1 ? lc.moveTo(x, y) : lc.lineTo(x, y); }
        lc.closePath(); lc.fillStyle = '#000'; lc.fill('evenodd');
        lc.restore();
      }
      inner('rgba(255,255,255,0.9)', 1.1 * K, 1.3 * K, 1.6 * K);
      inner('rgba(28,22,96,0.55)', -1.4 * K, -1.6 * K, 3.2 * K);
      lc.globalCompositeOperation = 'source-atop';
      var sh = lc.createLinearGradient((20 - CX) * K + dx, (0 - CY) * K + dy, (150 - CX) * K + dx, (180 - CY) * K + dy);
      sh.addColorStop(0, 'rgba(255,255,255,0.10)'); sh.addColorStop(0.55, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(20,16,70,0.22)');
      lc.fillStyle = sh; lc.fillRect(0, 0, w, h);
      lc.restore();
      return lt.c;
    }
    var lit = litFace(HD + 0.15); lit.className = 'lit';
    depth.appendChild(lit);

    /* Depth shade: darkens the ray while it is on the far side of the turbine */
    var sd = layer(HD + 0.3, WALL_RES);
    sd.ctx.setTransform(1, 0, 0, 1, 0, 0); sd.ctx.drawImage(sil.c, 0, 0);
    sd.ctx.globalCompositeOperation = 'source-in'; sd.ctx.fillStyle = '#05040c'; sd.ctx.fillRect(0, 0, sd.c.width, sd.c.height);
    sd.c.className = 'shade s' + i;
    depth.appendChild(sd.c);
    pitch.appendChild(ray);

    /* Two lagging echoes of the lit face: cheap motion trails while the turbine spins */
    for (var g = 1; g <= 2; g++) {
      var gw = document.createElement('div'); gw.className = 'p3 trail t' + i + '-' + g;
      var gc = layer(HD, 1);
      gc.ctx.setTransform(1, 0, 0, 1, 0, 0); gc.ctx.drawImage(lit, 0, 0, w, h);
      gc.c.className = 'ghost g' + g;
      gw.appendChild(gc.c);
      pitch.insertBefore(gw, pitch.firstChild);
    }

    var a = Math.atan2(cy - FY, cx - FX) * 180 / Math.PI;
    if (a < 0) a += 360;
    meta.push({ i: i, cx: cx, cy: cy, a: a, inner: i >= 9 });
    maskPolys += '<polygon points="' + pts.map(function (q) { return Q(q[0]) + ',' + Q(q[1]); }).join(' ') + '"/>';
  });

  /*
    Turbine: outer 9 rays and inner 5 rays become two counter-rotating rings, completing the fan into a full circle.
    Chain (rightmost first): centroid to origin, align ray to +x, push out to radius, place at slot angle, tilt ring.
    All functions are zero at 0% and 100%, so the slam lands exactly on the flat logo pose.
  */
  var TILT = 38;
  function ring(list, R, Z, dir, spin) {
    list.sort(function (p, q) { return p.a - q.a; });
    var n = list.length;
    list.forEach(function (m, k) {
      var phi = 180 + (k - (n - 1) / 2) * 360 / n;
      var b1 = phi + dir * 30, b2 = phi + dir * (30 + spin);
      var bEnd = dir > 0 ? 360 * Math.ceil((b2 + 30) / 360) : 360 * Math.floor((b2 - 30) / 360);
      var zz = Z + (k % 2 ? 10 : -10);
      var Dx = -(m.cx - CX) * S, Dy = -(m.cy - CY) * S;
      function T(A, B, r, z, C, dx, dy) {
        return 'transform:rotateX(' + Q(A) + 'deg) rotateZ(' + Q(B) + 'deg) translate3d(' + Q(r) + 'px,0,' + Q(z) + 'px) rotateZ(' + Q(C) + 'deg) translate3d(' + Q(dx) + 'px,' + Q(dy) + 'px,0)';
      }
      var name = 'o' + m.i;
      css += '@keyframes ' + name + '{' +
        '0%{' + T(0, 0, 0, 0, 0, 0, 0) + ';animation-timing-function:cubic-bezier(.2,.75,.25,1)}' +
        '30%{' + T(TILT, b1, R, zz, -m.a, Dx, Dy) + ';animation-timing-function:linear}' +
        '75%{' + T(TILT, b2, R + 6, zz, -m.a, Dx, Dy) + ';animation-timing-function:cubic-bezier(.62,0,.96,.5)}' +
        '100%{' + T(0, bEnd, 0, 0, 0, 0, 0) + '}}';
      css += '.r' + m.i + '{animation:' + name + ' 2000ms linear calc(var(--t0) + 1000ms) both}';
      css += '.t' + m.i + '-1{animation:' + name + ' 2000ms linear calc(var(--t0) + 1045ms) both}';
      css += '.t' + m.i + '-2{animation:' + name + ' 2000ms linear calc(var(--t0) + 1090ms) both}';
      /* far side of the tilted ring is darker: sample depth along the linear spin */
      var sk = '0%{opacity:0}';
      for (var s = 30; s <= 75; s += 5) {
        var B = (b1 + (b2 - b1) * (s - 30) / 45) * Math.PI / 180;
        var zv = R * Math.sin(B) * Math.sin(TILT * Math.PI / 180) + zz * Math.cos(TILT * Math.PI / 180);
        var o = Math.max(0, Math.min(1, -zv / 100)) * 0.6;
        sk += s + '%{opacity:' + Q(o) + '}';
      }
      sk += '92%{opacity:0}100%{opacity:0}';
      css += '@keyframes sh' + m.i + '{' + sk + '}.s' + m.i + '{animation:sh' + m.i + ' 2000ms linear calc(var(--t0) + 1000ms) both}';
    });
  }
  ring(meta.filter(function (m) { return !m.inner; }), 150, -24, 1, 210);
  ring(meta.filter(function (m) { return m.inner; }), 80, 44, -1, 260);
  css += '@keyframes gh1{0%{opacity:0}12%{opacity:.34}70%{opacity:.34}86%,100%{opacity:0}}' +
         '@keyframes gh2{0%{opacity:0}12%{opacity:.17}70%{opacity:.17}86%,100%{opacity:0}}' +
         '.g1{animation:gh1 2000ms linear calc(var(--t0) + 1000ms) both}.g2{animation:gh2 2000ms linear calc(var(--t0) + 1000ms) both}';

  /* Specular sweep, masked to the whole mark, riding just above the converged front faces */
  var shine = document.createElement('div'); shine.id = 'shine';
  var mask = 'url("data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 180">' + maskPolys + '</svg>') + '")';
  shine.style.webkitMaskImage = mask; shine.style.maskImage = mask;
  shine.style.width = 158 * S + 'px'; shine.style.height = 180 * S + 'px';
  shine.style.transform = 'translate3d(' + (-CX * S) + 'px,' + (-CY * S) + 'px,' + ((HD + 0.4) * S) + 'px)';
  shine.appendChild(document.createElement('i'));
  pitch.appendChild(shine);

  /* Radial sprite helper: dithered so soft falloffs never band on the dark ink */
  function sprite(size, cssSize, fn) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    var x2 = c.getContext('2d'), img = x2.createImageData(size, size), px = img.data;
    for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) {
      var u = (x + 0.5) / size * 2 - 1, v = (y + 0.5) / size * 2 - 1, col = fn(Math.sqrt(u * u + v * v));
      var o = (y * size + x) * 4;
      px[o] = col[0]; px[o + 1] = col[1]; px[o + 2] = col[2];
      px[o + 3] = Math.max(0, Math.min(255, col[3] * 255 + (Math.random() - 0.5) * 1.6));
    }
    x2.putImageData(img, 0, 0);
    c.style.width = c.style.height = cssSize + 'px';
    c.style.left = c.style.top = -cssSize / 2 + 'px';
    c.style.transformOrigin = '50% 50%';
    return c;
  }

  var glow = document.getElementById('glow');
  glow.style.transformOrigin = '0 0';
  glow.appendChild(sprite(160, 380, function (d) { return [122, 118, 255, Math.max(0, 0.19 * Math.exp(-d * d * 4.2) - 0.19 * Math.exp(-4.2))]; }));

  /* Impact effects, centred on the convergence point */
  var fx = document.getElementById('fx');
  var wave = function (id, thick, a) {
    var c = sprite(320, 320, function (d) { var t = (d - 0.86) / thick; return [196, 194, 255, a * Math.exp(-t * t)]; });
    c.id = id; return c;
  };
  fx.appendChild(wave('wave1', 0.05, 0.85));
  fx.appendChild(wave('wave2', 0.025, 0.5));
  var flash = sprite(160, 170, function (d) { return d < 1 ? [250, 249, 255, Math.pow(1 - d, 3.2)] : [0, 0, 0, 0]; });
  flash.id = 'flash'; fx.appendChild(flash);
  var N = 34, golden = 137.508;
  for (var j = 0; j < N; j++) {
    var sp = document.createElement('div'); sp.className = 'spark k' + j;
    var len = 10 + (j * 7 % 13), th = (j * golden + 9) % 360, dist = 80 + (j * 53 % 120), dur = 520 + (j * 37 % 260), del = 2995 + (j * 11 % 45);
    sp.style.width = len + 'px'; sp.style.top = '-1px';
    css += '@keyframes kf' + j + '{0%{opacity:0;transform:rotate(' + Q(th) + 'deg) translate3d(6px,0,0) scaleX(.4)}2%{opacity:1}65%{opacity:.85}100%{opacity:0;transform:rotate(' + Q(th) + 'deg) translate3d(' + dist + 'px,0,0) scaleX(.15)}}' +
           '.k' + j + '{animation:kf' + j + ' ' + dur + 'ms cubic-bezier(.08,.8,.2,1) calc(var(--t0) + ' + del + 'ms) both}';
    fx.appendChild(sp);
  }

  /* Faint dust field for scale; slowly drifts toward the viewer */
  var dust = document.getElementById('dust');
  function drawDust(vw, vh) {
    dust.width = Math.round(vw * DPR); dust.height = Math.round(vh * DPR);
    dust.style.width = vw + 'px'; dust.style.height = vh + 'px';
    dust.style.transformOrigin = '50% 46%';
    var d = dust.getContext('2d'), seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var n = 0; n < 170; n++) {
      var x = rnd() * vw * DPR, y = rnd() * vh * DPR, r = (0.4 + rnd() * rnd() * 1.4) * DPR, al = 0.12 + rnd() * 0.45;
      d.beginPath(); d.arc(x, y, r, 0, Math.PI * 2);
      d.fillStyle = 'rgba(' + (190 + rnd() * 50 | 0) + ',' + (188 + rnd() * 40 | 0) + ',255,' + al.toFixed(2) + ')'; d.fill();
    }
  }

  var word = document.getElementById('word');
  'Catalyst'.split('').forEach(function (ch, k) {
    var s = document.createElement('span'); s.textContent = ch; s.setAttribute('aria-hidden', 'true');
    s.style.animationDelay = 'calc(var(--t0) + ' + (4000 + k * 60) + 'ms)';
    word.appendChild(s);
  });
  var tag = document.getElementById('tag');

  css += '@media (prefers-reduced-motion: reduce){.ray,.trail,.shade,.ghost,.spark{animation:none!important}}.still .ray,.still .trail,.still .spark{animation:none!important}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  /* iOS (SwiftUI) centres the native image inside the safe area; Android centres it in the whole window.
     WKWebView reports the insets a few hundred ms after load, so wait for them before revealing. */
  var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(probe);
  function insets() { var cs = getComputedStyle(probe); return [parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingBottom) || 0]; }
  function start() {
    var vw = window.innerWidth, vh = window.innerHeight, ins = IOS ? insets() : [0, 0];
    /* Snap the origin to the device-pixel grid so frame 0 is as sharp as the native bitmap */
    var ox = Math.round(vw / 2 * DPR) / DPR, oy = Math.round((vh + ins[0] - ins[1]) / 2 * DPR) / DPR;
    lift.style.left = ox + 'px'; lift.style.top = oy + 'px';
    glow.style.left = ox + 4 + 'px'; glow.style.top = oy - 10 + 'px';
    fx.style.left = ox + (FX - CX) * S + 'px'; fx.style.top = oy + (FY - CY) * S + 'px';
    word.style.top = oy + 96 + 'px';
    tag.style.top = oy + 146 + 'px';
    if (!still) drawDust(vw, vh);
    var html = document.documentElement;
    /* iOS reveals exactly when we do. Android keeps the WebView at alpha 0 until onPageFinished plus a
       visual-state round trip (~300ms on a cold start while the app page loads), so hold the flat frame longer */
    html.style.setProperty('--t0', IOS ? '160ms' : '520ms');
    html.classList.add('ready');
    requestAnimationFrame(function () { requestAnimationFrame(function () { html.classList.add('go'); }); });
  }
  if (still) { start(); return; }
  if (!IOS) { if (document.readyState === 'complete') start(); else window.addEventListener('load', start); return; }
  var since = Date.now();
  (function wait() { if (insets()[0] > 0 || Date.now() - since > 900) start(); else setTimeout(wait, 16); })();
})();
</script>
</body>
