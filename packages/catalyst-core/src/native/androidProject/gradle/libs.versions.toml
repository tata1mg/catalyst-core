[versions]
agp = "8.11.1"
kotlin = "1.9.0"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
webkit = "1.13.0"
googleServices = "4.4.0"
androidxCredentials = "1.3.0"
googleId = "1.1.1"
# JVM unit test coverage (Tier 1, mirrors the CatalystCoreLogic llvm-cov
# setup on iOS — see #432/#413). 0.8.12 is the latest 0.8.x line still
# compatible with this project's Gradle 8.13 / AGP 8.11.1 without pulling
# in Jacoco's newer bytecode-instrumentation changes meant for JDK 21+
# language features this app doesn't use.
jacoco = "0.8.12"
# Test-only deps for #413 (Tier 1 Android unit tests). kotlinReflect is
# pinned ahead of the project's forced 2.0.21 Kotlin compiler version
# solely to satisfy mockito-kotlin 6.x's own kotlin-reflect requirement
# (>=2.1.20) — see the resolutionStrategy override in app/build.gradle.kts.
# kotlinxCoroutinesTest is pinned to the 1.10.x line (not the newer 1.11.x)
# because 1.11.x requires Kotlin 2.2.20, which is out of scope here; 1.10.x
# is the latest line still JVM-compatible with Kotlin 2.1.x.
mockitoCore = "5.23.0"
mockitoKotlin = "6.3.0"
kotlinReflect = "2.1.20"
kotlinxCoroutinesTest = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "androidxCredentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockitoCore" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlinReflect" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
