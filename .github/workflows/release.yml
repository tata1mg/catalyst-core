# How to release.
#
# latest:
#   1. Dispatch this workflow from main with channel=latest and the version to release
#      (include_ai + ai_version to ship catalyst-ai too).
#   2. It opens a release/<version> PR that carries the version bumps.
#   3. Merging that PR pushes packages/*/package.json to main, which runs publish.
#      guard only lets it through when the commit came from a release/* branch of this
#      repo. Other pushes touching those files (dependency bumps) end green with a notice.
#
# beta / canary:
#   Dispatch from main with the channel and source_ref set to the branch you want
#   released. The prerelease number is picked from npm and written into the
#   checkout only; nothing is committed and no PR is opened.
#
# Release notes cover the commits since the previous catalyst-core release on the same
# channel or stable (its npm gitHead). Without one they fall back to a single PR: the
# merged release PR on latest, pr_number on beta/canary. Prerelease notes only run
# when pr_number is given.
#
# If publish fails part way, use "Re-run failed jobs": packages already on npm are
# skipped, the tag is pushed right after each publish, and notes still run.
#
# publish runs in the "release" concurrency group, so releases never overlap. A newer
# run can still replace an older one that is waiting for the group.
#
# The workflow definition always comes from main; source_ref only selects the code.
# The release PR is opened with github.token, so pull_request CI does not run on it
# (it carries version bumps and the lockfile, nothing else).
# Versions are always given as X.Y.Z; beta and canary append -<channel>.N themselves,
# picked from npm. dry_run publishes, tags and opens nothing.

name: Release

on:
    workflow_dispatch:
        inputs:
            channel:
                description: "Channel"
                required: true
                type: choice
                options:
                    - latest
                    - beta
                    - canary
                default: beta
            version:
                description: "Version (X.Y.Z, no suffix)"
                required: true
                type: string
            source_ref:
                description: "Branch (beta/canary only)"
                required: false
                type: string
                default: main
            dry_run:
                description: "Dry run (publish nothing)"
                required: false
                type: boolean
                default: false
            include_ai:
                description: "Include catalyst-ai"
                required: false
                type: boolean
                default: false
            ai_version:
                description: "catalyst-ai version (X.Y.Z)"
                required: false
                type: string
                default: ""
            pr_number:
                description: "Release notes PR (beta/canary only)"
                required: false
                type: string
                default: ""
    push:
        branches:
            - main
        paths:
            - "packages/*/package.json"

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    prepare:
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'latest'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Require main
              if: ${{ !inputs.dry_run }}
              env:
                  BRANCH: ${{ github.ref_name }}
              run: |
                  if [ "$BRANCH" != "main" ]; then
                    echo "::error::latest releases must be dispatched from main (current: $BRANCH)"
                    exit 1
                  fi

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22.14.0"

            - run: npm ci --ignore-scripts

            - name: Bump versions
              id: versions
              env:
                  VERSION: ${{ inputs.version }}
                  AI_VERSION: ${{ inputs.ai_version }}
                  INCLUDE_AI: ${{ inputs.include_ai && '--include-ai' || '' }}
              run: |
                  # INCLUDE_AI is intentionally unquoted: empty means no argument
                  node scripts/release/release.js version --version "$VERSION" \
                    $INCLUDE_AI \
                    ${AI_VERSION:+--ai-version "$AI_VERSION"}

            - name: Open release PR
              if: ${{ !inputs.dry_run }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  CORE_VERSION: ${{ steps.versions.outputs.core_version }}
                  CCA_VERSION: ${{ steps.versions.outputs.cca_version }}
                  AI_VERSION: ${{ steps.versions.outputs.ai_version }}
              run: |
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git config user.name "github-actions[bot]"

                  BRANCH="release/$CORE_VERSION"

                  if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
                    echo "::error::$BRANCH already exists, delete it first"
                    exit 1
                  fi

                  SUMMARY="catalyst-core@$CORE_VERSION create-catalyst-app@$CCA_VERSION"
                  BODY="- catalyst-core@$CORE_VERSION"$'\n'"- create-catalyst-app@$CCA_VERSION"

                  if [ -n "$AI_VERSION" ]; then
                    SUMMARY="$SUMMARY catalyst-ai@$AI_VERSION"
                    BODY="$BODY"$'\n'"- catalyst-ai@$AI_VERSION"
                  fi

                  git checkout -b "$BRANCH"
                  git commit -am "chore: release $SUMMARY"
                  git push origin "$BRANCH"

                  PR_URL=$(gh pr create --base main --head "$BRANCH" \
                    --title "chore: release $SUMMARY" \
                    --body "$BODY")
                  echo "$PR_URL"
                  echo "Release PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

    # runs before the npm environment is entered, so a stray push cannot reach it
    guard:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        outputs:
            release: ${{ steps.pr.outputs.release }}
            pr_number: ${{ steps.pr.outputs.pr_number }}
        steps:
            - name: Require a release/* PR
              id: pr
              env:
                  GH_TOKEN: ${{ github.token }}
                  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
              run: |
                  # merged PR into main that carries this commit: "<head ref> <number> <head repo>"
                  FILTER='[.[] | select(.merged_at != null and .base.ref == "main")] | first // empty
                    | "\(.head.ref) \(.number) \(.head.repo.full_name // "")"'

                  # the commit -> PR link can lag right after a merge
                  for ATTEMPT in 1 2 3 4; do
                    if ! PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq "$FILTER"); then
                      echo "::error::could not list pull requests for $GITHUB_SHA"
                      exit 1
                    fi
                    if [ -n "$PR" ] || [ "$ATTEMPT" = 4 ]; then
                      break
                    fi
                    sleep 10
                  done

                  if [ -z "$PR" ]; then
                    case "$COMMIT_MESSAGE" in
                      "chore: release "*)
                        echo "::error::$GITHUB_SHA looks like a release commit but no merged release PR was found"
                        exit 1
                        ;;
                    esac
                    echo "::notice::$GITHUB_SHA did not come from a merged PR into main, nothing is published"
                    echo "release=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  read -r HEAD_REF PR_NUMBER HEAD_REPO <<< "$PR"

                  case "$HEAD_REF" in
                    release/*)
                      if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
                        echo "release=true" >> "$GITHUB_OUTPUT"
                        echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
                        exit 0
                      fi
                      ;;
                  esac

                  echo "::notice::PR #$PR_NUMBER ($HEAD_REPO:$HEAD_REF) is not a release PR, nothing is published"
                  echo "release=false" >> "$GITHUB_OUTPUT"

    publish:
        needs: guard
        if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.channel != 'latest') || (needs.guard.result == 'success' && needs.guard.outputs.release == 'true')) }}
        runs-on: ubuntu-latest
        environment: npm
        concurrency:
            group: release
            cancel-in-progress: false
        outputs:
            core_version: ${{ steps.release.outputs.core_version }}
            core_published: ${{ steps.release.outputs.core_published }}
            published: ${{ steps.release.outputs.published }}
            sha: ${{ steps.release.outputs.sha }}
            previous_version: ${{ steps.release.outputs.previous_version }}
            previous_sha: ${{ steps.release.outputs.previous_sha }}
            pr_number: ${{ needs.guard.outputs.pr_number }}
        steps:
            - name: Require main
              if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
              env:
                  BRANCH: ${{ github.ref_name }}
              run: |
                  if [ "$BRANCH" != "main" ]; then
                    echo "::error::releases must be dispatched from main (current: $BRANCH)"
                    exit 1
                  fi

            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || '' }}

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22.14.0"
                  registry-url: "https://registry.npmjs.org"

            - run: npm ci --ignore-scripts

            # Node 22 ships npm 10, which cannot do trusted publishing over OIDC.
            - run: npm install -g npm@11.5.1

            - name: Publish
              id: release
              env:
                  VERSION: ${{ inputs.version }}
                  AI_VERSION: ${{ inputs.ai_version }}
                  CHANNEL: ${{ github.event_name == 'push' && 'latest' || inputs.channel }}
                  INCLUDE_AI: ${{ github.event_name == 'workflow_dispatch' && inputs.include_ai && '--include-ai' || '' }}
                  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
              run: |
                  # INCLUDE_AI and DRY_RUN are intentionally unquoted: empty means no argument
                  node scripts/release/release.js publish \
                    ${VERSION:+--version "$VERSION"} ${AI_VERSION:+--ai-version "$AI_VERSION"} \
                    --channel "$CHANNEL" \
                    $INCLUDE_AI \
                    $DRY_RUN

            - name: Explain re-run
              if: failure()
              run: |
                  echo "Re-run failed jobs to finish: packages already on npm are skipped." >> "$GITHUB_STEP_SUMMARY"

    # on push, a re-run where core is already on npm publishes nothing but still sends notes
    notes:
        needs: publish
        if: ${{ !cancelled() && needs.publish.result == 'success' && (github.event_name == 'push' || needs.publish.outputs.core_published == 'true') && (needs.publish.outputs.pr_number != '' || inputs.pr_number != '') }}
        uses: ./.github/workflows/release-automation.yml
        with:
            version: ${{ needs.publish.outputs.core_version }}
            npm_tag: ${{ github.event_name == 'push' && 'latest' || inputs.channel }}
            pr_number: ${{ needs.publish.outputs.pr_number || inputs.pr_number }}
            commit_sha: ${{ needs.publish.outputs.sha }}
            previous_sha: ${{ needs.publish.outputs.previous_sha }}
