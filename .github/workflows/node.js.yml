name: CI Pipeline

on:
    pull_request:
        branches: ["main", "epic/**", "story/**", "task/**", "feature/**"]
    push:
        branches: ["main"]

# A new push to a pull request cancels the run still going for the previous
# push: its result no longer matters, and it would otherwise hold runners
# (macOS ones above all) that the new run then queues behind. Pushes to
# main are keyed by commit, so they never cancel each other and every one
# still writes its coverage baseline and caches.
concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Single source of truth for "what changed" -- every other job reads
    # this job's outputs via `if:` instead of re-diffing itself. Job-level
    # `if:` (not workflow-level `on.paths`) is deliberate: a job skipped by
    # `if:` still reports a Success status, so it doesn't leave a required
    # check hanging forever the way a workflow-level path filter would.
    #
    # The workflow files are OR'd into every platform filter below, not
    # just `web` -- a change to node.js.yml itself could affect what any of
    # those jobs run. The repo-level scripts/ folder is added only to the
    # filters whose jobs run something from it (the web jobs and the two
    # release checks); the Gradle and Xcode jobs do not, so a scripts-only
    # change does not start them.
    detect-changes:
        runs-on: ubuntu-latest
        outputs:
            web: ${{ steps.filter.outputs.web }}
            android: ${{ steps.filter.outputs.android }}
            ios: ${{ steps.filter.outputs.ios }}
            docs: ${{ steps.filter.outputs.docs }}
            ai_android: ${{ steps.filter.outputs.ai_android }}
            android_release: ${{ steps.filter.outputs.android_release }}
            ios_release: ${{ steps.filter.outputs.ios_release }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # On `push` (main-only, used to stamp the coverage baseline --
            # see android-unit-and-coverage), paths-filter diffs against
            # `github.event.before`, which is all-zeros on branch
            # creation/force-push. We do not pin `base:` here, so on that
            # rare case paths-filter falls back to treating everything as
            # changed rather than nothing -- a false "nothing changed" on
            # the baseline-writing run would silently skip the baseline
            # update, which is the wrong failure direction for a gate.
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              with:
                  # Default predicate-quantifier is "some" -- a filter matches
                  # if ANY pattern in its list matches, which makes the `!...`
                  # excludes below dead weight (a native-only change still
                  # satisfies the positive 'packages/catalyst-core/**'
                  # pattern, so `web` comes back true regardless of the
                  # excludes). "some-with-excludes" restores the intended
                  # semantics: match at least one positive pattern AND match
                  # none of the negative ones. Confirmed against
                  # dorny/paths-filter's own docs, not assumed.
                  predicate-quantifier: some-with-excludes
                  filters: |
                      # Changes that can affect every platform's CI.
                      workflows: &workflows
                        - '.github/workflows/**'
                      # Plus the repo-level scripts, for the jobs that run them.
                      shared: &shared
                        - '.github/workflows/**'
                        - 'scripts/**'
                      # Node toolchain/dependency files. Only chains that run
                      # `npm ci` (web, ai_android's integration job) care; the
                      # android/ios native jobs don't install npm deps, so a
                      # JS-only dependency change (e.g. removing a package)
                      # must not trigger them.
                      node_deps: &node_deps
                        - 'package.json'
                        - 'package-lock.json'
                        - '.nvmrc'
                      web:
                        - *shared
                        - *node_deps
                        - 'packages/catalyst-core/**'
                        - '!packages/catalyst-core/src/native/androidProject/**'
                        - '!packages/catalyst-core/src/native/iosnativeWebView/**'
                        - 'packages/create-catalyst-app/**'
                        - 'packages/catalyst-ai/**'
                        # catalyst-ai/android is a standalone com.android.library
                        # module (io.catalyst.nativeai). It is not web code and
                        # not part of androidProject's Gradle build -- the app
                        # loads it at runtime via ServiceLoader, and it is only
                        # linked when ai.enabled=true. Its own jobs
                        # (catalyst-ai-android-compile / -integration, gated on
                        # the ai_android filter below) compile it; excluded here
                        # so a Kotlin-only change doesn't needlessly run the web
                        # chain.
                        - '!packages/catalyst-ai/android/**'
                        - 'examples/error-catalog/**'
                      android:
                        - *workflows
                        - 'packages/catalyst-core/src/native/androidProject/**'
                      ios:
                        - *workflows
                        - 'packages/catalyst-core/src/native/iosnativeWebView/**'
                        # Generates the localhost.p12 the app target bundles.
                        - 'packages/catalyst-core/src/native/buildIos/localhostCert.js'
                      # The optional catalyst-ai native library: its own sources,
                      # plus the androidProject build wiring that includes and
                      # links it (settings.gradle.kts / app build.gradle.kts /
                      # version catalog) and the JS that syncs it into the build
                      # tree for an ai.enabled build.
                      ai_android:
                        - *workflows
                        - *node_deps
                        - 'packages/catalyst-ai/android/**'
                        - 'packages/catalyst-core/src/native/androidProject/settings.gradle.kts'
                        - 'packages/catalyst-core/src/native/androidProject/build.gradle.kts'
                        - 'packages/catalyst-core/src/native/androidProject/app/build.gradle.kts'
                        - 'packages/catalyst-core/src/native/androidProject/gradle/**'
                        - 'packages/catalyst-core/src/native/buildAndroid/**'
                      # The release-build jobs run the CLI end to end on a
                      # fixture app, so besides the native projects they
                      # depend on the native build JS, the CLI, the error
                      # registry and the core's own build. Each excludes the
                      # other platform's project and build code.
                      android_release:
                        - *shared
                        - *node_deps
                        - 'packages/catalyst-core/src/native/**'
                        - '!packages/catalyst-core/src/native/iosnativeWebView/**'
                        - '!packages/catalyst-core/src/native/buildIos/**'
                        - 'packages/catalyst-core/src/cli/**'
                        - 'packages/catalyst-core/src/errors/**'
                        - 'packages/catalyst-core/bin/**'
                        - 'packages/catalyst-core/scripts/**'
                        - 'packages/catalyst-core/package.json'
                        - 'examples/catalyst-core-test/**'
                      ios_release:
                        - *shared
                        - *node_deps
                        - 'packages/catalyst-core/src/native/**'
                        - '!packages/catalyst-core/src/native/androidProject/**'
                        - '!packages/catalyst-core/src/native/buildAndroid/**'
                        - 'packages/catalyst-core/src/cli/**'
                        - 'packages/catalyst-core/src/errors/**'
                        - 'packages/catalyst-core/bin/**'
                        - 'packages/catalyst-core/scripts/**'
                        - 'packages/catalyst-core/package.json'
                        - 'examples/catalyst-core-test/**'
                      docs:
                        - 'docs/**'

    lint:
        needs: detect-changes
        if: needs.detect-changes.outputs.web == 'true'
        runs-on: ubuntu-latest
        # actions: write is for the fail-fast cancel step only (cancelling a
        # run is an actions API write). contents stays read-only;
        # actions:write on GITHUB_TOKEN cannot touch code or secrets.
        permissions:
            contents: read
            actions: write
        # The four web jobs (lint, unit-and-contract-tests,
        # web-integration-smoke, error-catalog) run in parallel behind
        # detect-changes. They used to be chained lint -> unit -> smoke,
        # which put about 80s of waiting in front of the slowest job for
        # no technical reason. A failure in any of them still cancels the
        # rest of the run through its fail-fast step.

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: ".nvmrc"

            - name: Install dependencies
              run: node -v && npm ci

            - name: oxlint
              # --quiet: only fail on error-level findings. Warn-level
              # findings (pre-existing no-console / no-throw-new-error hits
              # in legacy src files, plus oxlint's default-ruleset noise)
              # are surfaced but non-blocking until they're cleaned up --
              # see the tracking issue linked from #415.
              #
              # oxfmt --check is intentionally NOT wired in yet: with no
              # oxfmt config in the repo, its defaults disagree with the
              # existing Prettier formatting on ~213/291 files. Wiring it up
              # is tracked as a follow-up once #396 (oxlint/oxfmt migration)
              # lands with a real config.
              run: npm run lint:oxlint

            # Fail-fast: the first job to fail cancels the whole run, so the
            # other platform chains (and any in-flight macOS runners) stop
            # instead of finishing work whose result no longer matters. The
            # cancel also marks THIS job `cancelled` rather than `failure`
            # in the checks list -- the failing step above still shows its
            # own red X, and coverage-summary (if: always()) re-runs, sees
            # `cancelled`, and fails naming every cancelled job, so the run
            # still has a clear red gate.
            #
            # Every ubuntu/macOS leaf job carries this exact step. The two
            # container jobs (ios-swiftlint, web-integration-smoke) ship
            # neither `gh` nor `curl`, so each has a paired `fail-fast-*`
            # ubuntu job (below) that cancels on its behalf.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    unit-and-contract-tests:
        # Parallel with lint -- see the lint job.
        needs: detect-changes
        if: needs.detect-changes.outputs.web == 'true'
        runs-on: ubuntu-latest
        # actions: write needed only for the release-time cache-delete step
        # below, same rationale as android-unit-and-coverage.
        permissions:
            contents: read
            actions: write
        outputs:
            line_pct: ${{ steps.coverage.outputs.line_pct }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: ".nvmrc"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      packages/catalyst-core/mcp_v2/package-lock.json

            - name: Install workspace dependencies
              run: node -v && npm ci

            - name: Install mcp_v2 dependencies
              # mcp_v2 is intentionally not an npm workspace member, so its
              # deps aren't installed by the root `npm ci` above -- it needs
              # its own install. It now checks in a package-lock.json (was
              # previously .gitignore'd), so `npm ci` applies here: a locked
              # install, and better-sqlite3 is pinned to 12.4.6, which ships
              # Node 20/22/23/24 prebuilt binaries. Previously `npm install`
              # on an unpinned `^9.4.3` resolved to 9.x, which has no Node 22
              # prebuild -- so CI recompiled better-sqlite3 from source with
              # node-gyp on every run (~75s). `npm ci` + a pinned prebuilt
              # version + the setup-node npm cache above brings this to ~2s.
              run: npm ci --prefix packages/catalyst-core/mcp_v2

            # Split into two commands rather than appending flags to
            # `npm run test:unit`: that script is
            # "npm run test --workspaces --if-present && npm --prefix
            # .../mcp_v2 test" -- appended args land at the END of the
            # whole string, i.e. on mcp_v2's test, not on vitest. mcp_v2
            # stays uninstrumented (its tests still run and still fail the
            # job on error; only its coverage is unmeasured) since it's
            # not an npm workspace member and wasn't part of this change's
            # verification.
            #
            # @vitest/coverage-v8 is pinned to the exact version as vitest
            # itself (4.1.9) in each workspace's devDependencies, same
            # precedent as the vitest pin from issue #433. Verified
            # locally end-to-end on a clean `npm ci` (no --legacy-peer-deps
            # needed for install-from-lockfile -- only needed once, to
            # regenerate package-lock.json after adding the dependency,
            # because of a real npm arborist bug in ideal-tree peer-set
            # resolution when ADDING a new package next to vitest's long
            # optional-peer list; npm ci installs from an already-resolved
            # lockfile and doesn't hit that code path).
            - name: Run unit/contract tests + type checks + coverage
              run: |
                  npm run test --workspaces --if-present -- --coverage --coverage.reporter=json-summary --coverage.reporter=text
                  npm --prefix packages/catalyst-core/mcp_v2 test
                  npm run test:release

            # Aggregate each workspace's coverage/coverage-summary.json
            # (vitest's own v8 coverage output; confirmed schema:
            # total.lines.{total,covered,pct}) into one package-wide line
            # %, same sum-covered-over-sum-total approach as jacoco
            # (Android) and the SPM codecov JSON (iOS CoreLogic). Only the
            # 3 npm workspaces are included -- mcp_v2 has no coverage
            # output by design (see above).
            - name: Print coverage summary
              id: coverage
              run: |
                  python3 - <<'EOF'
                  import glob, json, os
                  covered = total = 0
                  paths = glob.glob("packages/*/coverage/coverage-summary.json")
                  # catalyst-core, catalyst-ai, create-catalyst-app -- mcp_v2
                  # is excluded by design (see above). Checking the exact
                  # count, not just non-empty: if one workspace's coverage
                  # report silently fails to generate (a swallowed script
                  # error upstream, a partial test-step failure that didn't
                  # fail the job), the aggregate would otherwise compute from
                  # whatever's left with no error, silently skewing the
                  # number this gate exists to protect.
                  EXPECTED_WORKSPACES = 3
                  if len(paths) != EXPECTED_WORKSPACES:
                      raise SystemExit(
                          f"Expected {EXPECTED_WORKSPACES} coverage-summary.json files under "
                          f"packages/*/coverage/, found {len(paths)}: {sorted(paths)}"
                      )
                  for path in paths:
                      with open(path) as f:
                          report = json.load(f)
                      lines = report["total"]["lines"]
                      covered += lines["covered"]
                      total += lines["total"]
                      print(f"{path}: {lines['covered']}/{lines['total']} ({lines['pct']}%)")
                  pct = (covered / total * 100) if total else 0
                  print(f"AGGREGATE LINE {covered}/{total} ({pct:.2f}%)")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"line_pct={pct:.2f}\n")
                  EOF

            # Same restore-only-on-PR / write-only-on-main-push baseline
            # pattern as android-unit-and-coverage and
            # ios-corelogic-and-coverage. Separate cache key/file -- each
            # platform is an independent baseline.
            - name: Restore coverage baseline
              if: github.event_name == 'pull_request'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: coverage-baseline-web.json
                  key: coverage-baseline-web-v1

            - name: Enforce coverage does not regress vs last release
              if: github.event_name == 'pull_request'
              run: |
                  CURRENT="${{ steps.coverage.outputs.line_pct }}"
                  if [ ! -f coverage-baseline-web.json ]; then
                    echo "::warning::No web coverage baseline found (first run, or cache evicted) -- skipping regression check. Current: ${CURRENT}%"
                    exit 0
                  fi
                  BASELINE=$(python3 -c "import json; print(json.load(open('coverage-baseline-web.json'))['line_pct'])")
                  echo "Baseline (last release on main): ${BASELINE}%"
                  echo "Current (this PR):               ${CURRENT}%"
                  python3 -c "
                  import sys
                  current, baseline = float('$CURRENT'), float('$BASELINE')
                  if current < baseline:
                      print(f'::error::Web line coverage dropped: {current:.2f}% < {baseline:.2f}% (last release baseline)')
                      sys.exit(1)
                  print(f'OK: {current:.2f}% >= {baseline:.2f}%')
                  "

            - name: Update coverage baseline (main only)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "{\"line_pct\": ${{ steps.coverage.outputs.line_pct }}}" > coverage-baseline-web.json
                  gh cache delete coverage-baseline-web-v1 --repo "${{ github.repository }}" || true

            - name: Save coverage baseline (main only)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: coverage-baseline-web.json
                  key: coverage-baseline-web-v1

            # Fail-fast cancel -- see the lint job for the rationale.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    # The Playwright fixture test, in the Playwright container. The
    # create-catalyst-app and catalyst-ai checks that used to run after it
    # in this job need no browser, so they are in scaffold-and-ai-smoke on a
    # plain runner: they no longer wait for this container to be pulled or
    # for the fixture test to finish.
    web-integration-smoke:
        # Parallel with the other web jobs -- see the lint job.
        needs: detect-changes
        if: needs.detect-changes.outputs.web == 'true'
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.62.1-noble

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Build and Test (catalyst-core Playwright fixture)
              run: node -v && chmod +x ./scripts/test-catalyst-core.sh && ./scripts/test-catalyst-core.sh

            # No inline fail-fast step: this job runs in the playwright
            # container, which ships neither gh nor curl. fail-fast-smoke
            # (below) cancels on its behalf.

    # Fail-fast for web-integration-smoke: it runs in a container without
    # gh/curl, so a tiny ubuntu job does the cancel. `needs` a single job
    # so it fires the moment that job settles (a multi-need fail-fast job
    # would wait for all needs). On success it `if:`s out and costs
    # nothing; on the failure path it's one ~15s runner.
    fail-fast-smoke:
        needs: [web-integration-smoke]
        if: always() && needs.web-integration-smoke.result == 'failure'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
        steps:
            - name: Cancel the run
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    # create-catalyst-app scaffold-and-build and the catalyst-ai bundle
    # check. Split out of web-integration-smoke -- see that job.
    scaffold-and-ai-smoke:
        needs: detect-changes
        if: needs.detect-changes.outputs.web == 'true'
        runs-on: ubuntu-latest
        # actions: write for the fail-fast cancel step only -- see lint.
        permissions:
            contents: read
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: ".nvmrc"

            - name: Scaffold and Build Smoke Test (create-catalyst-app)
              run: node -v && chmod +x ./scripts/test-cca-smoke.sh && ./scripts/test-cca-smoke.sh

            - name: Install and Syntax Check (catalyst-ai)
              run: chmod +x ./scripts/test-catalyst-ai.sh && ./scripts/test-catalyst-ai.sh

            # Fail-fast cancel -- see the lint job for the rationale.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    error-catalog:
        # Contract gate for issue #440 / Story #343: proves each in-scope
        # error code (AI-000..003 + PREFLIGHT-001..022) actually surfaces the
        # way a developer would hit it — a real catalyst app is broken per
        # scenario, the real `catalyst start` / `catalyst serve` / an HTTP call is run, and the
        # coded error + doc URL is asserted in the output. Pass/fail only
        # (no coverage %), reported into coverage-summary like
        # web-integration-smoke. AI-000 (needs a live api.openai.com call) is
        # auto-skipped when CI=true — see test/scenarios.test.ts.
        #
        # Parallel with the other web jobs -- see the lint job.
        needs: detect-changes
        if: needs.detect-changes.outputs.web == 'true'
        runs-on: ubuntu-latest
        # actions: write for the fail-fast cancel step only -- see lint.
        permissions:
            contents: read
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc

            - name: Install root deps
              run: node -v && npm ci

            - name: Sync local catalyst-core + catalyst-ai into the example
              working-directory: examples/error-catalog
              run: |
                  npm install
                  npm run sync-core
                  npm run sync-packages

            - name: Run error-catalog contract scenarios
              working-directory: examples/error-catalog
              # FORCE_PORT_KILL: the runner is disposable and nothing else
              # listens on 3005, so the harness may hard-sweep the port
              # between scenarios. Locally this is opt-in (it could kill a
              # dev server) — see killTree in scripts/test-error.js.
              env:
                  CATALYST_ERROR_CATALOG_FORCE_PORT_KILL: "1"
              run: npm test

            # Fail-fast cancel -- see the lint job for the rationale.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    android-unit-and-coverage:
        # Parallel with android-lint, like the web jobs: chaining it behind
        # lint added lint's 2-3 minutes to the Android path.
        needs: detect-changes
        if: needs.detect-changes.outputs.android == 'true'
        runs-on: ubuntu-latest
        # actions: write is needed only for the release-time cache-delete
        # step below (`gh cache delete`, which is an API write). Scoped to
        # this job alone, not the workflow, so the container-based JS jobs
        # (running third-party test scripts) don't inherit it.
        permissions:
            contents: read
            actions: write
        outputs:
            line_pct: ${{ steps.coverage.outputs.line_pct }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up JDK 17
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
              with:
                  distribution: "temurin"
                  java-version: "17"
                  # Same built-in Gradle cache as android-lint. This job runs
                  # on its own fresh runner VM (jobs don't share a filesystem
                  # even when chained via needs:), so it restores the cache
                  # independently -- same key, so it picks up whatever the
                  # last default-branch push wrote.
                  cache: gradle

            # Gradle build cache -- see android-release-build.
            - name: Enable the Gradle build cache
              run: |
                  mkdir -p ~/.gradle
                  echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

            - name: Restore the Gradle build cache
              if: github.event_name == 'pull_request'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.gradle/caches/build-cache-1
                  key: gradle-build-cache-android-unit-and-coverage-${{ github.sha }}
                  restore-keys: |
                      gradle-build-cache-android-unit-and-coverage-

            # No android-actions/setup-android step: compileSdk 34 / AGP
            # 8.11.1 are already covered by ubuntu-latest's preinstalled
            # Android SDK (command-line tools + platform 34 + build-tools),
            # and Gradle's own wrapper (gradlew, pinned to 8.13 via
            # gradle-wrapper.properties) handles the Gradle version itself.

            # jacocoTestReport depends on testDebugUnitTest, so this still
            # runs (and fails the job on) the Tier 1 unit tests themselves
            # -- it just also turns the .exec coverage data
            # enableUnitTestCoverage=true already collects into a real
            # XML/HTML report, instead of leaving that data on the runner
            # unread. Mirrors the CatalystCoreLogic llvm-cov reporting on
            # iOS (#432) -- a pass/fail count alone doesn't say how much of
            # the app is actually exercised.
            - name: Run app/src/test (Tier 1 JVM unit tests) + coverage report
              working-directory: packages/catalyst-core/src/native/androidProject
              run: |
                  chmod +x ./gradlew
                  ./gradlew jacocoTestReport --console=plain

            - name: Print coverage summary
              id: coverage
              working-directory: packages/catalyst-core/src/native/androidProject
              run: |
                  python3 - <<'EOF'
                  import os
                  import xml.etree.ElementTree as ET
                  root = ET.parse("app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml").getroot()
                  line_pct = None
                  for c in root.findall("counter"):
                      cov, miss = int(c.get("covered")), int(c.get("missed"))
                      total = cov + miss
                      pct = (cov / total * 100) if total else 0
                      print(f"{c.get('type'):12s} {cov:6d}/{total:<6d} ({pct:5.2f}%)")
                      if c.get("type") == "LINE":
                          line_pct = pct
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"line_pct={line_pct:.2f}\n")
                  EOF

            # Coverage regression gate: restore-only on PRs. Never writes
            # from a PR run -- only the main-branch push run (below) is
            # allowed to update the baseline, otherwise a PR could poison
            # it by "landing" a lower number as the new floor for everyone
            # after it. Cache lookup falls through branch -> PR base branch
            # -> default branch (main), so this resolves even on PRs
            # targeting epic/**/feature/** branches, as long as main itself
            # has a saved baseline.
            #
            # Missing baseline (first run ever, or evicted after 7 days'
            # disuse / 10GB repo cache pressure) is treated as pass, not
            # fail -- a gate that hard-fails on infrastructure eviction
            # would look like a phantom regression unrelated to the PR's
            # actual code.
            - name: Restore coverage baseline
              if: github.event_name == 'pull_request'
              id: restore-baseline
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: coverage-baseline-android.json
                  key: coverage-baseline-android-v1

            - name: Enforce coverage does not regress vs last release
              if: github.event_name == 'pull_request'
              run: |
                  CURRENT="${{ steps.coverage.outputs.line_pct }}"
                  if [ ! -f coverage-baseline-android.json ]; then
                    echo "::warning::No Android coverage baseline found (first run, or cache evicted) -- skipping regression check. Current: ${CURRENT}%"
                    exit 0
                  fi
                  BASELINE=$(python3 -c "import json; print(json.load(open('coverage-baseline-android.json'))['line_pct'])")
                  echo "Baseline (last release on main): ${BASELINE}%"
                  echo "Current (this PR):               ${CURRENT}%"
                  python3 -c "
                  import sys
                  current, baseline = float('$CURRENT'), float('$BASELINE')
                  if current < baseline:
                      print(f'::error::Android line coverage dropped: {current:.2f}% < {baseline:.2f}% (last release baseline)')
                      sys.exit(1)
                  print(f'OK: {current:.2f}% >= {baseline:.2f}%')
                  "

            # Baseline write: only on push to main (i.e. after a PR merges
            # to the release branch), never from a PR run. Cache keys are
            # immutable once written, so we delete the old entry first
            # (`|| true` since "no such key yet" is expected on the very
            # first run) then save the fresh one under the same stable key.
            - name: Update coverage baseline (main only)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "{\"line_pct\": ${{ steps.coverage.outputs.line_pct }}}" > coverage-baseline-android.json
                  gh cache delete coverage-baseline-android-v1 --repo "${{ github.repository }}" || true

            - name: Save coverage baseline (main only)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: coverage-baseline-android.json
                  key: coverage-baseline-android-v1

            # always(): the report is most needed when the regression gate
            # above fails, to see exactly which lines changed.
            - name: Upload Jacoco coverage report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: android-jacoco-report
                  path: packages/catalyst-core/src/native/androidProject/app/build/reports/jacoco/jacocoTestReport
                  retention-days: 14

            # always(): a job that failed after Gradle ran still has outputs
            # worth keeping for the next pull requests.
            - name: Save the Gradle build cache (main only)
              if: always() # TEMP: measure warm caches on this PR
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.gradle/caches/build-cache-1
                  key: gradle-build-cache-android-unit-and-coverage-${{ github.sha }}

            # Fail-fast cancel -- see the lint job for the rationale.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    # Android Lint gate, parallel with android-unit-and-coverage. Gate
    # contract mirrors the web `lint` job: `abortOnError = true` (already
    # set in app/build.gradle.kts) fails the build on `error`-severity
    # issues; warnings are reported but non-blocking.
    android-lint:
        needs: detect-changes
        if: needs.detect-changes.outputs.android == 'true'
        runs-on: ubuntu-latest
        # actions: write for the fail-fast cancel step only -- see lint.
        permissions:
            contents: read
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up JDK 17
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
              with:
                  distribution: "temurin"
                  java-version: "17"
                  # setup-java's built-in Gradle cache: ~/.gradle/caches +
                  # ~/.gradle/wrapper, keyed on the gradle-related files it
                  # finds under the repo (*.gradle.kts, libs.versions.toml,
                  # gradle-wrapper.properties). Cold, this job spent ~60-90s
                  # re-fetching AGP 8.11.1 + the Kotlin compiler + lint deps
                  # and unpacking the wrapper on every run; warm, that is a
                  # restore. Only a push to a default branch writes the
                  # cache; PRs restore read-only, so a PR can't poison it.
                  # (android-unit-and-coverage runs on its own fresh VM and
                  # restores the same key independently -- see its comment.)
                  cache: gradle

            # Gradle build cache -- see android-release-build.
            - name: Enable the Gradle build cache
              run: |
                  mkdir -p ~/.gradle
                  echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

            - name: Restore the Gradle build cache
              if: github.event_name == 'pull_request'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.gradle/caches/build-cache-1
                  key: gradle-build-cache-android-lint-${{ github.sha }}
                  restore-keys: |
                      gradle-build-cache-android-lint-

            - name: Android Lint (debug)
              working-directory: packages/catalyst-core/src/native/androidProject
              run: |
                  chmod +x ./gradlew
                  ./gradlew lintDebug --console=plain

            - name: Upload lint report
              # `always()` -- the report is most useful precisely when the
              # job just failed.
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: android-lint-report
                  path: packages/catalyst-core/src/native/androidProject/app/build/reports/lint-results-debug.html
                  retention-days: 14

            # always(): a job that failed after Gradle ran still has outputs
            # worth keeping for the next pull requests.
            - name: Save the Gradle build cache (main only)
              if: always() # TEMP: measure warm caches on this PR
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.gradle/caches/build-cache-1
                  key: gradle-build-cache-android-lint-${{ github.sha }}

            # Fail-fast cancel -- see the lint job for the rationale. Runs
            # after the always() upload above, so the lint report is still
            # captured on a failing run.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    # Release build through the CLI, the way an app runs it: the packed
    # local catalyst-core installed into examples/catalyst-core-test, then
    # scripts/native-release-check.mjs (runnable locally too). It expects
    # NATIVE-001 for a LAN release url and NATIVE-003 for a com.example app
    # id, then builds two signed AABs with a throwaway keytool key packed
    # the way CATALYST_ANDROID_CREDENTIALS is: one from WEBVIEW_CONFIG.url
    # (asserting buildType=release, the prod LOCAL_IP, the fixture's
    # apiBaseUrl, no private IP in webview_config.properties, the upload
    # certificate PEM beside the AAB and 16 KB aligned native libraries) and
    # one legacy config with the prod host in LOCAL_IP and buildType
    # "release", which must pass with the deprecation warning.
    #
    # Standalone on its own filter (needs: detect-changes), like the
    # catalyst-ai jobs: it is about the native build JS as much as the
    # Android project, and a JS-only change should not pay for the Gradle
    # lint and coverage chain.
    android-release-build:
        needs: detect-changes
        if: needs.detect-changes.outputs.android_release == 'true'
        runs-on: ubuntu-latest
        # actions: write for the fail-fast cancel step only -- see lint.
        permissions:
            contents: read
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: ".nvmrc"

            - name: Set up JDK 17
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
              with:
                  distribution: "temurin"
                  java-version: "17"
                  # Same Gradle cache as android-lint: the CLI builds a copy
                  # of the same androidProject, so the dependencies match.
                  cache: gradle

            # Gradle build cache. The check builds the release twice, and each
            # build starts with `gradlew clean`, so without it the second
            # build recompiles everything the first just built. With
            # org.gradle.caching on, a task whose inputs are unchanged takes
            # its output from ~/.gradle/caches/build-cache-1 instead. Set in
            # the runner's own gradle.properties, so what the CLI runs for an
            # app developer is unchanged.
            #
            # Kept across runs the same way as the coverage baselines: pull
            # requests restore and never save, so one cannot put task outputs
            # in front of later runs; a push to main builds without restoring
            # and saves, so the cache holds one build's outputs and does not
            # grow from run to run. Every Gradle job does this with its own
            # key, since each runs different tasks.
            - name: Enable the Gradle build cache
              run: |
                  mkdir -p ~/.gradle
                  echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

            - name: Restore the Gradle build cache
              if: github.event_name == 'pull_request'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.gradle/caches/build-cache-1
                  key: gradle-build-cache-android-release-build-${{ github.sha }}
                  restore-keys: |
                      gradle-build-cache-android-release-build-

            # Same install as scripts/test-catalyst-core.sh: the fixture gets
            # the tarball npm would publish, not a workspace symlink.
            - name: Install the packed local catalyst-core into the fixture
              run: |
                  npm ci
                  npm run prepare --workspace packages/catalyst-core
                  npm pack --workspace packages/catalyst-core --pack-destination "$RUNNER_TEMP" --ignore-scripts --silent
                  cd examples/catalyst-core-test
                  npm install --no-save --package-lock=false "$RUNNER_TEMP"/catalyst-core-*.tgz

            # ubuntu-latest ships the API 36 platform and build-tools, and
            # ANDROID_HOME points at them.
            - name: Release build checks
              run: node scripts/native-release-check.mjs android examples/catalyst-core-test

            # always(): a job that failed after Gradle ran still has outputs
            # worth keeping for the next pull requests.
            - name: Save the Gradle build cache (main only)
              if: always() # TEMP: measure warm caches on this PR
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.gradle/caches/build-cache-1
                  key: gradle-build-cache-android-release-build-${{ github.sha }}

            # Fail-fast cancel -- see the lint job for the rationale.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    # SwiftLint gate -- first job in the iOS chain
    # (ios-swiftlint -> ios-corelogic-and-coverage -> ios-app-simulator-tests).
    # Runs on ubuntu (SwiftLint ships a Linux binary) in the official
    # container pinned to the same version developers run locally, so CI
    # and local agree exactly -- ~15s, and a lint failure here means the
    # two macOS runners downstream never spin up. Gate contract: plain
    # `swiftlint lint` (no `--strict`), so `error`-severity violations fail
    # and warnings are reported but non-blocking; the .swiftlint.yml next
    # to the sources defines the thresholds and exclusions. NOTE: image is
    # tag-pinned, not digest-pinned like the actions/* refs -- acceptable
    # for a lint tool, revisit if supply-chain policy tightens.
    ios-swiftlint:
        needs: detect-changes
        if: needs.detect-changes.outputs.ios == 'true'
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/realm/swiftlint:0.61.0
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: SwiftLint
              working-directory: packages/catalyst-core/src/native/iosnativeWebView
              run: |
                  swiftlint version
                  swiftlint lint --reporter github-actions-logging

            # No inline fail-fast step: the swiftlint container ships
            # neither gh nor curl. fail-fast-swiftlint (below) cancels on
            # its behalf.

    # Fail-fast for ios-swiftlint: it runs in a container without gh/curl,
    # so a tiny ubuntu job does the cancel. Single `needs` so it fires as
    # soon as ios-swiftlint settles. `if:`s out on success (costs nothing);
    # one ~15s runner on the failure path.
    fail-fast-swiftlint:
        needs: [ios-swiftlint]
        if: always() && needs.ios-swiftlint.result == 'failure'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
        steps:
            - name: Cancel the run
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    # iOS counterpart of android-release-build: `buildApp:ios --release` on
    # the same fixture through scripts/native-release-check.mjs. Expects
    # NATIVE-001 for a LAN release url, NATIVE-003 for a com.example app id
    # and IOS-010 for a release with no signing team. There is no unsigned
    # release, so the signed IPA check (CFBundleVersion,
    # CFBundleShortVersionString, CFBundleIdentifier,
    # ITSAppUsesNonExemptEncryption, PrivacyInfo.xcprivacy and the generated
    # ConfigConstants url) runs only when the repository has the
    # CATALYST_IOS_CREDENTIALS and RELEASE_CHECK_IOS_APP_ID secrets (plus
    # RELEASE_CHECK_IOS_TEAM_ID for cloud signing); without them, as on fork
    # pull requests, it is skipped with a note. Standalone on its own
    # filter, for the same reason as the Android job.
    ios-release-archive:
        needs: detect-changes
        if: needs.detect-changes.outputs.ios_release == 'true'
        runs-on: macos-26
        # actions: write for the fail-fast cancel step only -- see lint.
        permissions:
            contents: read
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Pinned like the other iOS jobs: an image update must not change
            # the SDK under the tests.
            - name: Select Xcode 26.5
              run: sudo xcode-select -s /Applications/Xcode_26.5.app && xcodebuild -version

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: ".nvmrc"

            - name: Install the packed local catalyst-core into the fixture
              run: |
                  npm ci
                  npm run prepare --workspace packages/catalyst-core
                  npm pack --workspace packages/catalyst-core --pack-destination "$RUNNER_TEMP" --ignore-scripts --silent
                  cd examples/catalyst-core-test
                  npm install --no-save --package-lock=false "$RUNNER_TEMP"/catalyst-core-*.tgz

            - name: Release build checks
              env:
                  CATALYST_IOS_CREDENTIALS: ${{ secrets.CATALYST_IOS_CREDENTIALS }}
                  RELEASE_CHECK_IOS_APP_ID: ${{ secrets.RELEASE_CHECK_IOS_APP_ID }}
                  RELEASE_CHECK_IOS_TEAM_ID: ${{ secrets.RELEASE_CHECK_IOS_TEAM_ID }}
              run: node scripts/native-release-check.mjs ios examples/catalyst-core-test

            # Fail-fast cancel -- see the lint job for the rationale.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    # -----------------------------------------------------------------
    # catalyst-ai native library (Android) -- two jobs.
    #
    # packages/catalyst-ai/android is a standalone com.android.library
    # module (io.catalyst.nativeai). Nothing in androidProject depends on
    # it at compile time -- NativeBridge.kt discovers CatalystAIBridge at
    # runtime via Class.forName + ServiceLoader -- and it is only synced
    # into the build tree, and linked, when a build sets ai.enabled=true.
    # So neither the web chain nor android-unit-and-coverage ever compiles
    # this Kotlin. These jobs do.
    #
    # Both are standalone (needs: detect-changes, gated on the ai_android
    # filter) rather than chained behind an android job: a break here is a
    # linkage/compile problem in the optional module, independent of the
    # main app's lint/tests.
    # -----------------------------------------------------------------

    catalyst-ai-android-compile:
        # Fast path: sync the module in the way `sync-packages --packages ai`
        # / an ai.enabled build do (into androidProject/../node_modules),
        # then prove Gradle picks it up and it compiles -- against the
        # in-repo androidProject, no scaffold. ~2 min.
        needs: detect-changes
        if: needs.detect-changes.outputs.ai_android == 'true'
        runs-on: ubuntu-latest
        # actions: write for the fail-fast cancel step only -- see lint.
        permissions:
            contents: read
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up JDK 17
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
              with:
                  distribution: "temurin"
                  java-version: "17"
                  cache: gradle

            # Gradle build cache -- see android-release-build.
            - name: Enable the Gradle build cache
              run: |
                  mkdir -p ~/.gradle
                  echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

            - name: Restore the Gradle build cache
              if: github.event_name == 'pull_request'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.gradle/caches/build-cache-1
                  key: gradle-build-cache-catalyst-ai-android-compile-${{ github.sha }}
                  restore-keys: |
                      gradle-build-cache-catalyst-ai-android-compile-

            - name: Sync catalyst-ai into node_modules (mirrors sync-packages --packages ai)
              run: |
                  set -euo pipefail
                  dest=packages/catalyst-core/src/native/node_modules/catalyst-ai
                  mkdir -p "$dest"
                  rsync -a --exclude node_modules --exclude .git \
                    packages/catalyst-ai/ "$dest/"

            - name: Assert Gradle includes :catalyst-ai
              # This is the regression test for the bug this module's wiring
              # had: settings.gradle.kts looked for a package name that
              # never existed, so the include silently no-op'd and the
              # module was compiled by nothing. A bare compile check would
              # pass vacuously in that state (no module => nothing to
              # build). Fail loudly if the include is not active.
              working-directory: packages/catalyst-core/src/native/androidProject
              run: |
                  set -euo pipefail
                  chmod +x ./gradlew
                  ./gradlew projects --console=plain | tee /tmp/projects.txt
                  grep -q "Project ':catalyst-ai'" /tmp/projects.txt \
                    || { echo "::error::androidProject did not include :catalyst-ai after sync -- check settings.gradle.kts"; exit 1; }

            - name: Compile :catalyst-ai (Kotlin)
              working-directory: packages/catalyst-core/src/native/androidProject
              run: ./gradlew :catalyst-ai:compileDebugKotlin --console=plain

            - name: Test Android AI prompt construction
              working-directory: packages/catalyst-core/src/native/androidProject
              run: ./gradlew :catalyst-ai:testDebugUnitTest --console=plain

            - name: Compile :app against :catalyst-ai with ai.enabled=true
              # ai.enabled=true puts :catalyst-ai on the app's
              # implementation config (APK bundling) and flips
              # useLegacyPackaging. Exercises manifest merge (minSdk
              # alignment) and the app's own Kotlin compile with the module
              # present.
              working-directory: packages/catalyst-core/src/native/androidProject
              run: |
                  set -euo pipefail
                  printf '%s' '{"WEBVIEW_CONFIG":{"ai":{"enabled":true},"android":{"buildType":"debug"}}}' > /tmp/ai-config.json
                  ./gradlew :app:processDebugMainManifest :app:compileDebugKotlin \
                    -PconfigPath=/tmp/ai-config.json --console=plain

            # always(): a job that failed after Gradle ran still has outputs
            # worth keeping for the next pull requests.
            - name: Save the Gradle build cache (main only)
              if: always() # TEMP: measure warm caches on this PR
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.gradle/caches/build-cache-1
                  key: gradle-build-cache-catalyst-ai-android-compile-${{ github.sha }}

            # Fail-fast cancel -- see the lint job for the rationale.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    catalyst-ai-android-integration:
        # Dev-accurate path: the maintained examples/useai app, which
        # already ships a config with ai.enabled=true. Sync the local
        # catalyst-core + catalyst-ai into it the way a developer does
        # (npm run sync-core / sync-packages), run the real headless
        # Android prep (buildAndroidForTesting -> syncAIPackageIfEnabled),
        # then include-assert + compile the module inside the app's synced
        # copy of androidProject. This is the end-to-end check of the JS
        # sync path that the compile job above skips. ~5-8 min.
        needs: detect-changes
        if: needs.detect-changes.outputs.ai_android == 'true'
        runs-on: ubuntu-latest
        # actions: write for the fail-fast cancel step only -- see lint.
        permissions:
            contents: read
            actions: write
        defaults:
            run:
                working-directory: examples/useai
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: ".nvmrc"

            - name: Set up JDK 17
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
              with:
                  distribution: "temurin"
                  java-version: "17"
                  cache: gradle

            # Gradle build cache -- see android-release-build.
            - name: Enable the Gradle build cache
              run: |
                  mkdir -p ~/.gradle
                  echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

            - name: Restore the Gradle build cache
              if: github.event_name == 'pull_request'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.gradle/caches/build-cache-1
                  key: gradle-build-cache-catalyst-ai-android-integration-${{ github.sha }}
                  restore-keys: |
                      gradle-build-cache-catalyst-ai-android-integration-

            - name: Install root workspace deps
              working-directory: .
              run: node -v && npm ci

            - name: Prepare examples/useai (config + install + sync core & ai)
              # config.template.json already has AI_CONFIG.enabled and
              # WEBVIEW_CONFIG.ai.enabled = true -- no patching. sync-core
              # builds catalyst-core and installs the packed local build;
              # sync-packages copies the local catalyst-ai into
              # node_modules (its android/ module included), which is what
              # settings.gradle.kts and syncAIPackageIfEnabled both target.
              run: |
                  set -euo pipefail
                  cp config/config.template.json config/config.json
                  npm install
                  npm run sync-core
                  # useai's sync-packages script already ends with `--packages`,
                  # so the arg is just the package short-name.
                  npm run sync-packages -- ai
                  test -f node_modules/catalyst-ai/android/build.gradle.kts

            - name: Run headless Android prep (buildAndroidForTesting)
              # Real code path: initializeConfig -> asset copy -> plugin
              # compose -> syncAIPackageIfEnabled. No emulator/device.
              # catalystCorePath resolves to examples/useai/node_modules/
              # catalyst-core, so the AI module is synced to that package's
              # dist/native/node_modules/catalyst-ai -- the sibling of the
              # androidProject the next step runs in.
              run: |
                  set -euo pipefail
                  node -e '
                    const path = require("path");
                    // catalyst-core has an "exports" map, so a deep
                    // require("catalyst-core/dist/native/...") is blocked.
                    // Resolve the package dir and require the file by
                    // absolute path -- the same thing bin/catalyst.js does.
                    const coreDir = path.dirname(require.resolve("catalyst-core/package.json"));
                    const { createAndroidBuild } = require(path.join(coreDir, "dist/native/buildAndroid/index.js"));
                    const cfg = require("./config/config.json");
                    createAndroidBuild({ WEBVIEW_CONFIG: cfg.WEBVIEW_CONFIG, BUILD_OUTPUT_PATH: cfg.BUILD_OUTPUT_PATH })
                      .buildAndroidForTesting()
                      .then(r => { if (!r || !r.success) { console.error("buildAndroidForTesting did not succeed"); process.exit(1); } })
                      .catch(e => { console.error(e && e.stack || e); process.exit(1); });
                  '

            - name: Assert Gradle includes :catalyst-ai and it compiles
              working-directory: examples/useai/node_modules/catalyst-core/dist/native/androidProject
              run: |
                  set -euo pipefail
                  chmod +x ./gradlew
                  ./gradlew projects --console=plain | tee /tmp/projects.txt
                  grep -q "Project ':catalyst-ai'" /tmp/projects.txt \
                    || { echo "::error::useai's androidProject did not include :catalyst-ai after an ai.enabled prep -- the JS sync path is broken"; exit 1; }
                  ./gradlew :catalyst-ai:compileDebugKotlin --console=plain

            # always(): a job that failed after Gradle ran still has outputs
            # worth keeping for the next pull requests.
            - name: Save the Gradle build cache (main only)
              if: always() # TEMP: measure warm caches on this PR
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.gradle/caches/build-cache-1
                  key: gradle-build-cache-catalyst-ai-android-integration-${{ github.sha }}

            # Fail-fast cancel -- see the lint job for the rationale.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    # Split from what was a single test-ios-unit job into two: CoreLogic
    # (this job) runs first, has zero dependencies, needs no simulator, and
    # is the only iOS target that can produce a real coverage percentage
    # today. ios-app-simulator-tests (below) depends on this job passing before it
    # pays for the much more expensive simulator boot + full UIKit build.
    # This does cost a second macOS runner spin-up versus running
    # both in one job's steps (a real wall-clock/minutes trade-off -- see
    # the original single-job version's reasoning in git history) but
    # gives CoreLogic its own pass/fail check and lets it feed the
    # coverage regression gate independently of the simulator-based run.
    ios-corelogic-and-coverage:
        # Parallel with ios-swiftlint and ios-app-simulator-tests. The three
        # used to be chained, which put lint and this job (about 2 minutes
        # together, plus two runner pickups) in front of the simulator job,
        # the longest job in the pipeline. A lint failure still cancels the
        # macOS jobs through fail-fast-swiftlint.
        needs: detect-changes
        if: needs.detect-changes.outputs.ios == 'true'
        runs-on: macos-26
        # actions: write needed only for the release-time cache-delete
        # step below, same rationale as android-unit-and-coverage.
        permissions:
            contents: read
            actions: write
        outputs:
            line_pct: ${{ steps.coverage.outputs.line_pct }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # macos-26 carries several Xcodes and its default moves with
            # image updates; pin one (listed in actions/runner-images'
            # macos-26 readme) so results do not change under us.
            - name: Select Xcode 26.5
              run: sudo xcode-select -s /Applications/Xcode_26.5.app && xcodebuild -version

            # CatalystCoreLogic (#432): the UIKit-free nested SPM package
            # split out of CatalystCore. Zero dependencies, no simulator,
            # no network package resolution. Measured locally: 171 tests
            # in well under a second (excluding cold build time).
            - name: Run CatalystCoreLogic unit tests + coverage
              id: swift-test
              working-directory: packages/catalyst-core/src/native/iosnativeWebView
              run: |
                  set -o pipefail
                  swift test --package-path CoreLogic --enable-code-coverage
                  # --show-codecov-path is the documented way to get the
                  # exact JSON path SPM will write -- doesn't re-run tests,
                  # just resolves the path. Avoids guessing the build
                  # triple directory name (.build/debug is a convenience
                  # symlink to .build/<triple>/debug; relying on that
                  # symlink via a glob is incidental layout, not a
                  # documented contract).
                  echo "path=$(swift test --package-path CoreLogic --show-codecov-path)" >> "$GITHUB_OUTPUT"

            # SPM's own coverage JSON (llvm-cov's `export -format=text`
            # shape) is per-file, not pre-aggregated -- schema confirmed
            # against mattpolzin/swift-test-codecov's Decodable structs:
            # { data: [ { files: [ { summary: { lines: {count,covered,
            # percent} } } ] } ] }. Sum covered/count across every file
            # ourselves for a package-wide line %, same approach as the
            # jacoco parser below for Android.
            #
            # Filter to Sources/CatalystCoreLogic only: the report also
            # includes the test target's own files (Tests/**), which are
            # near-100% covered by definition -- including them inflates
            # the % and makes it move when tests are added/removed rather
            # than when production code coverage actually changes. jacoco
            # doesn't have this problem (it instruments main sources only,
            # test code isn't part of its report) -- filtering here keeps
            # both platforms gating on the same semantics: production-code
            # coverage only.
            - name: Print coverage summary
              id: coverage
              working-directory: packages/catalyst-core/src/native/iosnativeWebView
              env:
                  CODECOV_PATH: ${{ steps.swift-test.outputs.path }}
              run: |
                  python3 - <<'EOF'
                  import json, os
                  path = os.environ["CODECOV_PATH"]
                  with open(path) as f:
                      report = json.load(f)
                  covered = total = 0
                  for file in report["data"][0]["files"]:
                      if "Sources/CatalystCoreLogic" not in file["filename"]:
                          continue
                      lines = file["summary"]["lines"]
                      covered += lines["covered"]
                      total += lines["count"]
                  pct = (covered / total * 100) if total else 0
                  print(f"LINE {covered}/{total} ({pct:.2f}%)")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"line_pct={pct:.2f}\n")
                  EOF

            # Same restore-only-on-PR / write-only-on-main-push pattern as
            # Android's gate. Separate cache key/file -- iOS and Android
            # are independent baselines, not a combined number.
            - name: Restore coverage baseline
              if: github.event_name == 'pull_request'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: coverage-baseline-ios.json
                  key: coverage-baseline-ios-v1

            - name: Enforce coverage does not regress vs last release
              if: github.event_name == 'pull_request'
              run: |
                  CURRENT="${{ steps.coverage.outputs.line_pct }}"
                  if [ ! -f coverage-baseline-ios.json ]; then
                    echo "::warning::No iOS coverage baseline found (first run, or cache evicted) -- skipping regression check. Current: ${CURRENT}%"
                    exit 0
                  fi
                  BASELINE=$(python3 -c "import json; print(json.load(open('coverage-baseline-ios.json'))['line_pct'])")
                  echo "Baseline (last release on main): ${BASELINE}%"
                  echo "Current (this PR):               ${CURRENT}%"
                  python3 -c "
                  import sys
                  current, baseline = float('$CURRENT'), float('$BASELINE')
                  if current < baseline:
                      print(f'::error::iOS CoreLogic line coverage dropped: {current:.2f}% < {baseline:.2f}% (last release baseline)')
                      sys.exit(1)
                  print(f'OK: {current:.2f}% >= {baseline:.2f}%')
                  "

            - name: Update coverage baseline (main only)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "{\"line_pct\": ${{ steps.coverage.outputs.line_pct }}}" > coverage-baseline-ios.json
                  gh cache delete coverage-baseline-ios-v1 --repo "${{ github.repository }}" || true

            - name: Save coverage baseline (main only)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: coverage-baseline-ios.json
                  key: coverage-baseline-ios-v1

            # Fail-fast cancel -- see the lint job for the rationale.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    # Simulator-based XCTest run of the app target, the longest job in the
    # pipeline. What keeps it short:
    #   - the simulator is picked and booted in the background while the
    #     app compiles, instead of before it;
    #   - compiler outputs come from Xcode's compilation cache, saved by
    #     the last push to main;
    #   - the tests run on that booted simulator, not on a clone of it.
    ios-app-simulator-tests:
        # Parallel with ios-swiftlint and ios-corelogic-and-coverage -- see
        # ios-corelogic-and-coverage.
        needs: detect-changes
        if: needs.detect-changes.outputs.ios == 'true'
        runs-on: macos-26
        # actions: write needed only for the release-time cache-delete
        # step below, same rationale as the other coverage-gated jobs.
        permissions:
            contents: read
            actions: write
        outputs:
            line_pct: ${{ steps.coverage.outputs.line_pct }}
        env:
            # Xcode's compilation cache directory (see "Restore the
            # compilation cache" below). Outside the checkout so xcodebuild
            # and git never see it as project content.
            XCODE_CAS_DIR: /Users/runner/xcode-compilation-cache

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # macos-26 carries several Xcodes and its default moves with
            # image updates; pin one (listed in actions/runner-images'
            # macos-26 readme) so results do not change under us.
            - name: Select Xcode 26.5
              run: sudo xcode-select -s /Applications/Xcode_26.5.app && xcodebuild -version

            # Pick an iPhone simulator and boot it, all in the background,
            # so the step returns at once and the build below starts while
            # CoreSimulator is still waking up (the first simctl call took
            # about a minute on this runner, the cold boot about 2.5). The
            # build targets the generic simulator destination, so it does
            # not need to know which device this picks. "Wait for the
            # simulator" below collects the result.
            #
            # The device is picked at run time instead of hardcoding a
            # name: GitHub only keeps a small, rotating set of preinstalled
            # simulators, and a hardcoded "iPhone 16" has already gone
            # missing once. `simctl list -j` rather than
            # `xcodebuild -showdestinations`, which loads the project and
            # can stall on package resolution.
            #
            # "e"-suffixed models (iPhone 16e, 17e, ...) are excluded: one
            # picked in an earlier CI run took over 2 minutes to connect
            # and then failed loading the test bundle. Newest iOS runtime
            # first, then the first matching device within it.
            # Not `erase`-ing first: the runner is a fresh ephemeral VM.
            - name: Pick and boot an iOS simulator (background)
              run: |
                  mkdir -p "$RUNNER_TEMP/sim"
                  cat > "$RUNNER_TEMP/sim/boot.sh" <<'EOF'
                  #!/bin/bash
                  set -uo pipefail
                  OUT="$1"
                  fail() { echo "$1"; echo failed > "$OUT/status"; exit 1; }
                  RESULT=$(xcrun simctl list devices available -j | jq -r '
                    .devices
                    | to_entries
                    | map(select(.key | test("com\\.apple\\.CoreSimulator\\.SimRuntime\\.iOS")))
                    | sort_by(.key) | reverse
                    | map(.value | map(select(.name | test("^iPhone( [0-9]+)?$|^iPhone [0-9]+ ")) | select(.name | test("[0-9]+e( |$)") | not)))
                    | flatten
                    | .[0]
                    | if . == null then "" else (.udid + "\t" + .name) end
                  ') || fail "simctl list failed"
                  if [ -z "$RESULT" ]; then
                    xcrun simctl list devices available
                    fail "No available iOS Simulator with an iPhone destination found on this runner"
                  fi
                  UDID=$(echo "$RESULT" | cut -f1)
                  echo "Selected simulator: $(echo "$RESULT" | cut -f2) ($UDID)"
                  # `boot` fails when the device is already booted; bootstatus
                  # -b is the check that matters.
                  xcrun simctl boot "$UDID" || true
                  xcrun simctl bootstatus "$UDID" -b || fail "simulator $UDID did not boot"
                  echo "$UDID" > "$OUT/udid"
                  echo ok > "$OUT/status"
                  EOF
                  chmod +x "$RUNNER_TEMP/sim/boot.sh"
                  nohup "$RUNNER_TEMP/sim/boot.sh" "$RUNNER_TEMP/sim" > "$RUNNER_TEMP/sim/boot.log" 2>&1 &

            # Cache resolved SPM packages (AppAuth, GoogleSignIn, etc.)
            # keyed on Package.resolved -- avoids re-fetching them from
            # GitHub over the network on every run.
            - name: Cache SPM packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: packages/catalyst-core/src/native/iosnativeWebView/.spm-cache
                  key: spm-${{ runner.os }}-${{ hashFiles('packages/catalyst-core/src/native/iosnativeWebView/Package.resolved') }}
                  restore-keys: |
                      spm-${{ runner.os }}-

            # Xcode 26's compilation cache stores each compiler output under
            # a hash of its inputs, so a compile whose inputs are unchanged
            # is copied out of the cache instead of run. That is what makes
            # it safe to keep across runs where DerivedData is not: nothing
            # depends on file times or on what an earlier build left behind.
            # Most of this build is the Google Sign-In, AppAuth and GTM
            # packages, which change only when Package.resolved does.
            #
            # Pull requests restore and never save; a push to main builds
            # without restoring and saves, so the cache holds one build's
            # outputs and does not grow from run to run.
            - name: Restore the compilation cache
              if: github.event_name == 'pull_request'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.XCODE_CAS_DIR }}
                  key: xcode-cas-26.5-${{ github.sha }}
                  restore-keys: |
                      xcode-cas-26.5-

            # localhost.p12 (the in-app HTTPS server's self-signed identity) is
            # generated per build and not committed; the app target bundles
            # it, so create one before Xcode builds.
            - name: Generate localhost.p12
              run: node packages/catalyst-core/src/native/buildIos/localhostCert.js

            # Build and test are separate xcodebuild calls so the log shows
            # how long each takes.
            #
            # generic/platform=iOS Simulator with ARCHS=arm64: build for the
            # simulator without naming a device (it is still booting), and
            # for the runner's own architecture only -- a generic
            # destination would otherwise build x86_64 as well.
            # CODE_SIGNING_ALLOWED=NO skips signing entirely -- there's no
            # device to install a signed build on, only the simulator.
            # -only-testing:iosnativeWebViewTests scopes the run to the
            # Tier 1 unit test target only -- the scheme also carries
            # iosnativeWebViewUITests, which is real-device/simulator
            # instrumented UI testing (Tier 2, explicitly out of scope
            # for #414) and failed to even load its bundle in CI.
            #
            # -disableAutomaticPackageResolution -skipPackageUpdates: use
            # the versions in the committed Package.resolved and the
            # checkouts restored into .spm-cache, without asking GitHub
            # whether newer ones exist. A Package.resolved that is out of
            # step with the manifest fails the build here instead of being
            # rewritten.
            # COMPILER_INDEX_STORE_ENABLE=NO: no editor reads the index on
            # a CI runner, so do not spend compile time writing it.
            - name: Build iosnativeWebViewTests
              working-directory: packages/catalyst-core/src/native/iosnativeWebView
              run: |
                  set -o pipefail
                  xcodebuild build-for-testing \
                    -project iosnativeWebView.xcodeproj \
                    -scheme iosnativeWebView \
                    -destination "generic/platform=iOS Simulator" \
                    -only-testing:iosnativeWebViewTests \
                    -clonedSourcePackagesDirPath .spm-cache \
                    -disableAutomaticPackageResolution \
                    -skipPackageUpdates \
                    -enableCodeCoverage YES \
                    ARCHS=arm64 \
                    COMPILATION_CACHE_ENABLE_CACHING=YES \
                    COMPILATION_CACHE_CAS_PATH="$XCODE_CAS_DIR" \
                    COMPILER_INDEX_STORE_ENABLE=NO \
                    CODE_SIGNING_ALLOWED=NO \
                    | xcbeautify --renderer github-actions

            # Collect the background step's result: up to 10 minutes for the
            # boot to finish, then its log either way.
            - name: Wait for the simulator
              id: sim
              run: |
                  for _ in $(seq 1 300); do
                    [ -f "$RUNNER_TEMP/sim/status" ] && break
                    sleep 2
                  done
                  cat "$RUNNER_TEMP/sim/boot.log" || true
                  if [ "$(cat "$RUNNER_TEMP/sim/status" 2>/dev/null)" != "ok" ]; then
                    echo "::error::The iOS simulator was not ready (see the log above)"
                    exit 1
                  fi
                  echo "id=$(cat "$RUNNER_TEMP/sim/udid")" >> "$GITHUB_OUTPUT"

            # -parallel-testing-enabled NO: the test plan marks the target
            # parallelizable, and with that xcodebuild does not use the
            # simulator booted above -- it creates "Clone 1 of <device>",
            # boots that as well and runs the tests there. One clone runs
            # nothing in parallel, so this only removes the second boot.
            # Running several clones was tried and made two
            # timing-sensitive tests (a permission callback wait, a
            # concurrent-logging expectation) flake on this runner.
            # -enableCodeCoverage YES + -resultBundlePath: xcodebuild
            # writes an .xcresult bundle carrying per-target line coverage,
            # parsed below via `xcrun xccov`. resultBundlePath must not
            # already exist, which is guaranteed here (fresh checkout).
            - name: Run iosnativeWebViewTests (Tier 1 XCTest unit tests)
              working-directory: packages/catalyst-core/src/native/iosnativeWebView
              run: |
                  set -o pipefail
                  # No --quieter: on a failure it printed only a one-line
                  # "##[error] <test name> (N seconds)" with no assertion
                  # detail. Without it xcbeautify prints the full XCTest
                  # failure message (assertion, expected/actual, file:line).
                  xcodebuild test-without-building \
                    -project iosnativeWebView.xcodeproj \
                    -scheme iosnativeWebView \
                    -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
                    -only-testing:iosnativeWebViewTests \
                    -clonedSourcePackagesDirPath .spm-cache \
                    -disableAutomaticPackageResolution \
                    -skipPackageUpdates \
                    -parallel-testing-enabled NO \
                    -enableCodeCoverage YES \
                    -resultBundlePath TestResults.xcresult \
                    | xcbeautify --renderer github-actions

            # Saved before the coverage gate below so a coverage failure on
            # main does not also cost the next pull requests their cache.
            - name: Save the compilation cache (main only)
              if: success() # TEMP: measure warm caches on this PR
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.XCODE_CAS_DIR }}
                  key: xcode-cas-26.5-${{ github.sha }}

            # xccov's report JSON has one entry per built target (app,
            # unit test bundle, UI test bundle) -- filter to the app
            # target only. The test-bundle targets report near-100%
            # coverage of their own test code by definition (not
            # production code), which is why they're excluded, same
            # reasoning as filtering Tests/** out of the iOS CoreLogic
            # coverage JSON. Schema confirmed locally: top-level
            # `targets: [{name, coveredLines, executableLines,
            # lineCoverage}]`, lineCoverage as a 0-1 fraction.
            - name: Print coverage summary
              id: coverage
              working-directory: packages/catalyst-core/src/native/iosnativeWebView
              run: |
                  xcrun xccov view --report --json TestResults.xcresult > xccov-report.json
                  python3 - <<'EOF'
                  import json, os
                  with open("xccov-report.json") as f:
                      report = json.load(f)
                  app_target = next(
                      (t for t in report["targets"] if t["name"] == "iosnativeWebView.app"),
                      None,
                  )
                  if app_target is None:
                      raise SystemExit("iosnativeWebView.app target not found in xccov report")
                  covered = app_target["coveredLines"]
                  total = app_target["executableLines"]
                  pct = (covered / total * 100) if total else 0
                  print(f"LINE {covered}/{total} ({pct:.2f}%)")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"line_pct={pct:.2f}\n")
                  EOF

            # Same restore-only-on-PR / write-only-on-main-push baseline
            # pattern as the other three coverage-gated jobs. Own cache
            # key/file -- this is the UIKit app target's coverage, a
            # different (and today lower) number than CoreLogic's, not a
            # combined iOS figure.
            - name: Restore coverage baseline
              if: github.event_name == 'pull_request'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: coverage-baseline-ios-app.json
                  key: coverage-baseline-ios-app-v1

            - name: Enforce coverage does not regress vs last release
              if: github.event_name == 'pull_request'
              run: |
                  CURRENT="${{ steps.coverage.outputs.line_pct }}"
                  if [ ! -f coverage-baseline-ios-app.json ]; then
                    echo "::warning::No iOS app coverage baseline found (first run, or cache evicted) -- skipping regression check. Current: ${CURRENT}%"
                    exit 0
                  fi
                  BASELINE=$(python3 -c "import json; print(json.load(open('coverage-baseline-ios-app.json'))['line_pct'])")
                  echo "Baseline (last release on main): ${BASELINE}%"
                  echo "Current (this PR):               ${CURRENT}%"
                  python3 -c "
                  import sys
                  current, baseline = float('$CURRENT'), float('$BASELINE')
                  if current < baseline:
                      print(f'::error::iOS app line coverage dropped: {current:.2f}% < {baseline:.2f}% (last release baseline)')
                      sys.exit(1)
                  print(f'OK: {current:.2f}% >= {baseline:.2f}%')
                  "

            - name: Update coverage baseline (main only)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "{\"line_pct\": ${{ steps.coverage.outputs.line_pct }}}" > coverage-baseline-ios-app.json
                  gh cache delete coverage-baseline-ios-app-v1 --repo "${{ github.repository }}" || true

            - name: Save coverage baseline (main only)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: coverage-baseline-ios-app.json
                  key: coverage-baseline-ios-app-v1

            # Fail-fast cancel -- see the lint job for the rationale.
            - name: Fail-fast -- cancel the rest of the run
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

    # Terminal join point for the ENTIRE pipeline -- every test/coverage
    # job feeds into this one, including web-integration-smoke (no
    # coverage number, gated on pass/fail only -- it's an
    # integration/smoke job, not a unit-test target). Numbers are printed
    # for all four platforms that produce one: web (vitest), android
    # (jacoco), ios-corelogic (CatalystCoreLogic, llvm-cov), and ios-app
    # (iosnativeWebView.app target, xccov).
    #
    # `if: always()` + explicit per-job result checks (not a bare `needs`)
    # because a skipped platform (e.g. an android-only PR, where the iOS
    # and web jobs never run) must still count as fine here, not failure.
    coverage-summary:
        needs:
            [
                detect-changes,
                lint,
                unit-and-contract-tests,
                web-integration-smoke,
                scaffold-and-ai-smoke,
                error-catalog,
                android-lint,
                android-unit-and-coverage,
                catalyst-ai-android-compile,
                catalyst-ai-android-integration,
                ios-swiftlint,
                ios-corelogic-and-coverage,
                ios-app-simulator-tests,
                android-release-build,
                ios-release-archive,
            ]
        if: always()
        runs-on: ubuntu-latest
        # Reads only the needs.* results and outputs: no checkout, no API calls.
        permissions:
            contents: read
        steps:
            - name: Report per-platform coverage and verify no regression
              run: |
                  detect_status="${{ needs.detect-changes.result }}"
                  lint_status="${{ needs.lint.result }}"
                  web_status="${{ needs.unit-and-contract-tests.result }}"
                  web_smoke_status="${{ needs.web-integration-smoke.result }}"
                  scaffold_smoke_status="${{ needs.scaffold-and-ai-smoke.result }}"
                  error_catalog_status="${{ needs.error-catalog.result }}"
                  android_lint_status="${{ needs.android-lint.result }}"
                  android_status="${{ needs.android-unit-and-coverage.result }}"
                  ai_android_compile_status="${{ needs.catalyst-ai-android-compile.result }}"
                  ai_android_integration_status="${{ needs.catalyst-ai-android-integration.result }}"
                  ios_swiftlint_status="${{ needs.ios-swiftlint.result }}"
                  ios_corelogic_status="${{ needs.ios-corelogic-and-coverage.result }}"
                  ios_app_status="${{ needs.ios-app-simulator-tests.result }}"
                  android_release_status="${{ needs.android-release-build.result }}"
                  ios_release_status="${{ needs.ios-release-archive.result }}"
                  web_pct="${{ needs.unit-and-contract-tests.outputs.line_pct }}"
                  android_pct="${{ needs.android-unit-and-coverage.outputs.line_pct }}"
                  ios_corelogic_pct="${{ needs.ios-corelogic-and-coverage.outputs.line_pct }}"
                  ios_app_pct="${{ needs.ios-app-simulator-tests.outputs.line_pct }}"

                  report_platform() {
                    name="$1"; status="$2"; pct="$3"
                    if [ "$status" = "skipped" ]; then
                      echo "  $name: n/a (not run on this PR)"
                    elif [ -z "$pct" ]; then
                      echo "  $name: status=$status, no coverage number reported"
                    else
                      echo "  $name: ${pct}% (status=$status)"
                    fi
                  }

                  echo "Coverage summary:"
                  report_platform "web (js unit tests, 3 workspaces aggregated)" "$web_status" "$web_pct"
                  report_platform "web-integration-smoke (not a coverage platform, pass/fail only)" "$web_smoke_status" ""
                  report_platform "scaffold-and-ai-smoke (create-catalyst-app + catalyst-ai checks, pass/fail only)" "$scaffold_smoke_status" ""
                  report_platform "error-catalog (error-contract gate, pass/fail only)" "$error_catalog_status" ""
                  report_platform "android-lint (Android Lint gate, pass/fail only)" "$android_lint_status" ""
                  report_platform "android (jacoco)" "$android_status" "$android_pct"
                  report_platform "catalyst-ai-android-compile (module compile gate, pass/fail only)" "$ai_android_compile_status" ""
                  report_platform "catalyst-ai-android-integration (scaffold+sync e2e, pass/fail only)" "$ai_android_integration_status" ""
                  report_platform "ios-swiftlint (SwiftLint gate, pass/fail only)" "$ios_swiftlint_status" ""
                  report_platform "ios-corelogic (CatalystCoreLogic, llvm-cov)" "$ios_corelogic_status" "$ios_corelogic_pct"
                  report_platform "ios-app (iosnativeWebView.app target, xccov)" "$ios_app_status" "$ios_app_pct"
                  report_platform "android-release-build (CLI release AAB checks, pass/fail only)" "$android_release_status" ""
                  report_platform "ios-release-archive (CLI release IPA checks, pass/fail only)" "$ios_release_status" ""

                  # detect-changes itself failing/erroring (not just "nothing
                  # changed") means the per-platform jobs below were skipped
                  # for an infrastructure reason, not because there was
                  # nothing to test -- that must fail the gate outright,
                  # since every platform status would otherwise read
                  # "skipped" and pass by the loop below's own logic.
                  if [ "$detect_status" != "success" ]; then
                    echo "::error::detect-changes did not pass (status: $detect_status) -- platform jobs were skipped for an infrastructure reason, not because nothing changed"
                    exit 1
                  fi

                  fail=0
                  for pair in "lint:$lint_status" "web:$web_status" "web-integration-smoke:$web_smoke_status" "scaffold-and-ai-smoke:$scaffold_smoke_status" "error-catalog:$error_catalog_status" "android-lint:$android_lint_status" "android:$android_status" "catalyst-ai-android-compile:$ai_android_compile_status" "catalyst-ai-android-integration:$ai_android_integration_status" "ios-swiftlint:$ios_swiftlint_status" "ios-corelogic:$ios_corelogic_status" "ios-app:$ios_app_status" "android-release-build:$android_release_status" "ios-release-archive:$ios_release_status"; do
                    platform="${pair%%:*}"
                    status="${pair#*:}"
                    if [ "$status" != "success" ] && [ "$status" != "skipped" ]; then
                      echo "::error::$platform did not pass (status: $status)"
                      fail=1
                    fi
                  done

                  if [ "$fail" -eq 1 ]; then
                    exit 1
                  fi
                  echo "Coverage OK on every platform that reported it (or not applicable to this PR)."

    docs:
        # Runs in parallel with everything else, behind detect-changes
        # only. It used to wait for coverage-summary, which put its ~3
        # minutes after the slowest job of the run although nothing in it
        # depends on the test or coverage jobs. It stays its own check and
        # is not part of coverage-summary, as before.
        needs: detect-changes
        if: needs.detect-changes.outputs.docs == 'true'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: ".nvmrc"

            - name: Build Docs
              run: |
                  node -v
                  npm ci
                  npm --prefix docs ci
                  # docs consumes catalyst-core/webmcp, which only exists in
                  # this repo's build — not in the published package the
                  # lockfile pins. Same pattern as examples/error-catalog.
                  npm --prefix docs run sync-core
                  cp docs/config/config_template.json docs/config/config.json
                  npm --prefix docs run lint
                  npm run docs:build
                  npm --prefix docs run docs:check-links -- --strict

            # `docs:build` alone cannot catch a server-render failure: the docs
            # app renders WebMcpProvider, and a production-only duplicate
            # router context (issue #550) built fine and then returned 500 on
            # every page under `catalyst serve`. Serve the real build and
            # fetch real pages.
            - name: Serve the production build and smoke-test it
              working-directory: docs
              run: |
                  npm run serve > /tmp/docs-serve.log 2>&1 &
                  SERVER_PID=$!
                  trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
                  for i in $(seq 1 30); do
                      curl -fs -o /dev/null http://localhost:3005/ && break
                      sleep 2
                  done
                  status=0
                  for path in / /content/Introduction/why-catalyst /errors; do
                      code=$(curl -s -o /tmp/page.html -w '%{http_code}' "http://localhost:3005$path") || code=000
                      echo "$path -> $code"
                      if [ "$code" != "200" ] || grep -q "Internal Server Error" /tmp/page.html; then
                          status=1
                      fi
                  done
                  if [ "$status" != "0" ]; then
                      echo "--- server log ---"
                      cat /tmp/docs-serve.log
                  fi
                  exit $status

    # The Devtron deploy gate scans the built IMAGE, which lockfile scans,
    # npm audit and semgrep never see: npm's vendored dependencies, the Go
    # binary esbuild ships, and the Alpine packages. Build the same image
    # and apply the gate's rule (no fixable High/Critical). Medium/Low are
    # listed for visibility but do not fail here, because new advisories
    # would turn a docs PR red on a day it touched nothing.
    #
    # Its own job, parallel with `docs`: the image build and scan share
    # nothing with the build-and-serve check there, and were about two of
    # that job's three minutes.
    docs-image-scan:
        needs: detect-changes
        if: needs.detect-changes.outputs.docs == 'true'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The cache mount keeps Trivy's vulnerability databases between
            # the two scans; each `docker run --rm` otherwise starts empty
            # and downloads them again.
            - name: Scan the docs image (deploy-gate parity)
              run: |
                  docker build --pull -f docs/Dockerfile -t catalyst-docs:ci .
                  mkdir -p "$RUNNER_TEMP/trivy-cache"
                  TRIVY="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $RUNNER_TEMP/trivy-cache:/root/.cache/trivy ghcr.io/aquasecurity/trivy:0.70.0 image --scanners vuln --ignore-unfixed --skip-version-check"
                  $TRIVY --severity LOW,MEDIUM catalyst-docs:ci || true
                  $TRIVY --severity HIGH,CRITICAL --exit-code 1 catalyst-docs:ci
