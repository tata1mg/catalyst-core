name: CI Pipeline

on:
    pull_request:
        branches: ["main", "epic/**", "story/**", "task/**", "feature/**"]
    push:
        branches: ["main"]

jobs:
    # Single source of truth for "what changed" -- every other job reads
    # this job's outputs via `if:` instead of re-diffing itself. Job-level
    # `if:` (not workflow-level `on.paths`) is deliberate: a job skipped by
    # `if:` still reports a Success status, so it doesn't leave a required
    # check hanging forever the way a workflow-level path filter would.
    #
    # Root/shared paths (workflow files, lockfiles, node version, shared
    # scripts) are OR'd into every platform filter below, not just `web` --
    # a change to node.js.yml itself or to package-lock.json should still
    # trigger android/ios, since either could affect what those jobs run.
    detect-changes:
        runs-on: ubuntu-latest
        outputs:
            web: ${{ steps.filter.outputs.web }}
            android: ${{ steps.filter.outputs.android }}
            ios: ${{ steps.filter.outputs.ios }}
            docs: ${{ steps.filter.outputs.docs }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            # On `push` (main-only, used to stamp the coverage baseline --
            # see test-android-unit), paths-filter diffs against
            # `github.event.before`, which is all-zeros on branch
            # creation/force-push. We do not pin `base:` here, so on that
            # rare case paths-filter falls back to treating everything as
            # changed rather than nothing -- a false "nothing changed" on
            # the baseline-writing run would silently skip the baseline
            # update, which is the wrong failure direction for a gate.
            - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
              id: filter
              with:
                  filters: |
                      shared: &shared
                        - '.github/workflows/**'
                        - 'package.json'
                        - 'package-lock.json'
                        - '.nvmrc'
                        - 'scripts/**'
                      web:
                        - *shared
                        - 'packages/catalyst-core/**'
                        - '!packages/catalyst-core/src/native/androidProject/**'
                        - '!packages/catalyst-core/src/native/iosnativeWebView/**'
                        - 'packages/create-catalyst-app/**'
                        - 'packages/catalyst-ai/**'
                      android:
                        - *shared
                        - 'packages/catalyst-core/src/native/androidProject/**'
                      ios:
                        - *shared
                        - 'packages/catalyst-core/src/native/iosnativeWebView/**'
                      docs:
                        - 'docs/**'

    lint:
        needs: detect-changes
        if: needs.detect-changes.outputs.web == 'true'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"

            - name: Install dependencies
              run: node -v && npm ci

            - name: oxlint
              # --quiet: only fail on error-level findings. Warn-level
              # findings (pre-existing no-console / no-throw-new-error hits
              # in legacy src files, plus oxlint's default-ruleset noise)
              # are surfaced but non-blocking until they're cleaned up --
              # see the tracking issue linked from #415.
              run: npm run lint:oxlint

            # oxfmt --check is intentionally NOT wired in yet: with no
            # oxfmt config in the repo, its defaults disagree with the
            # existing Prettier formatting on ~213/291 files. Wiring it up
            # is tracked as a follow-up once #396 (oxlint/oxfmt migration)
            # lands with a real config.

    test-js-unit:
        needs: detect-changes
        if: needs.detect-changes.outputs.web == 'true'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"

            - name: Install workspace dependencies
              run: node -v && npm ci

            - name: Install mcp_v2 dependencies
              # mcp_v2 is intentionally not an npm workspace member, so its
              # deps aren't installed by the root `npm ci` above. It also
              # has no package-lock.json of its own, so `npm ci` (which
              # requires one) doesn't apply here -- use `npm install`.
              run: npm install --prefix packages/catalyst-core/mcp_v2

            - name: Run unit/contract tests + type checks
              run: npm run test:unit

    # Merges what were 3 separate jobs (test-js-integration,
    # create-catalyst-app, catalyst-ai) into one. All 3 declared the same
    # `mcr.microsoft.com/playwright:v1.62.1-noble` container; GitHub Actions
    # cannot share a running container across jobs (each job is a fresh VM
    # and pulls its own container image before the job starts), so running
    # them as 3 parallel jobs meant paying that pull 3x on every PR that
    # touched web code. Folding them into sequential steps in one job pays
    # it once. Trade-off: loses the parallel wall-clock and per-job failure
    # isolation the 3-job split had -- a failure in step 1 still lets steps
    # 2/3 report clearly in the job log, just not as 3 separate check marks.
    test-js-combined:
        needs: detect-changes
        if: needs.detect-changes.outputs.web == 'true'
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.62.1-noble

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Build and Test (catalyst-core Playwright fixture)
              run: node -v && chmod +x ./scripts/test-catalyst-core.sh && ./scripts/test-catalyst-core.sh

            - name: Scaffold and Build Smoke Test (create-catalyst-app)
              run: chmod +x ./scripts/test-cca-smoke.sh && ./scripts/test-cca-smoke.sh

            - name: Install and Syntax Check (catalyst-ai)
              run: chmod +x ./scripts/test-catalyst-ai.sh && ./scripts/test-catalyst-ai.sh

    test-android-unit:
        needs: detect-changes
        if: needs.detect-changes.outputs.android == 'true'
        runs-on: ubuntu-latest
        # actions: write is needed only for the release-time cache-delete
        # step below (`gh cache delete`, which is an API write). Scoped to
        # this job alone, not the workflow, so the container-based JS jobs
        # (running third-party test scripts) don't inherit it.
        permissions:
            contents: read
            actions: write

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Set up JDK 17
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
              with:
                  distribution: "temurin"
                  java-version: "17"

            # No android-actions/setup-android step: compileSdk 34 / AGP
            # 8.11.1 are already covered by ubuntu-latest's preinstalled
            # Android SDK (command-line tools + platform 34 + build-tools),
            # and Gradle's own wrapper (gradlew, pinned to 8.13 via
            # gradle-wrapper.properties) handles the Gradle version itself.

            # jacocoTestReport depends on testDebugUnitTest, so this still
            # runs (and fails the job on) the Tier 1 unit tests themselves
            # -- it just also turns the .exec coverage data
            # enableUnitTestCoverage=true already collects into a real
            # XML/HTML report, instead of leaving that data on the runner
            # unread. Mirrors the CatalystCoreLogic llvm-cov reporting on
            # iOS (#432) -- a pass/fail count alone doesn't say how much of
            # the app is actually exercised.
            - name: Run app/src/test (Tier 1 JVM unit tests) + coverage report
              working-directory: packages/catalyst-core/src/native/androidProject
              run: |
                  chmod +x ./gradlew
                  ./gradlew jacocoTestReport --console=plain

            - name: Print coverage summary
              id: coverage
              working-directory: packages/catalyst-core/src/native/androidProject
              run: |
                  python3 - <<'EOF'
                  import os
                  import xml.etree.ElementTree as ET
                  root = ET.parse("app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml").getroot()
                  line_pct = None
                  for c in root.findall("counter"):
                      cov, miss = int(c.get("covered")), int(c.get("missed"))
                      total = cov + miss
                      pct = (cov / total * 100) if total else 0
                      print(f"{c.get('type'):12s} {cov:6d}/{total:<6d} ({pct:5.2f}%)")
                      if c.get("type") == "LINE":
                          line_pct = pct
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"line_pct={line_pct:.2f}\n")
                  EOF

            # Coverage regression gate: restore-only on PRs. Never writes
            # from a PR run -- only the main-branch push run (below) is
            # allowed to update the baseline, otherwise a PR could poison
            # it by "landing" a lower number as the new floor for everyone
            # after it. Cache lookup falls through branch -> PR base branch
            # -> default branch (main), so this resolves even on PRs
            # targeting epic/**/feature/** branches, as long as main itself
            # has a saved baseline.
            #
            # Missing baseline (first run ever, or evicted after 7 days'
            # disuse / 10GB repo cache pressure) is treated as pass, not
            # fail -- a gate that hard-fails on infrastructure eviction
            # would look like a phantom regression unrelated to the PR's
            # actual code.
            - name: Restore coverage baseline
              if: github.event_name == 'pull_request'
              id: restore-baseline
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: coverage-baseline-android.json
                  key: coverage-baseline-android-v1

            - name: Enforce coverage does not regress vs last release
              if: github.event_name == 'pull_request'
              run: |
                  CURRENT="${{ steps.coverage.outputs.line_pct }}"
                  if [ ! -f coverage-baseline-android.json ]; then
                    echo "::warning::No Android coverage baseline found (first run, or cache evicted) -- skipping regression check. Current: ${CURRENT}%"
                    exit 0
                  fi
                  BASELINE=$(python3 -c "import json; print(json.load(open('coverage-baseline-android.json'))['line_pct'])")
                  echo "Baseline (last release on main): ${BASELINE}%"
                  echo "Current (this PR):               ${CURRENT}%"
                  python3 -c "
                  import sys
                  current, baseline = float('$CURRENT'), float('$BASELINE')
                  if current < baseline:
                      print(f'::error::Android line coverage dropped: {current:.2f}% < {baseline:.2f}% (last release baseline)')
                      sys.exit(1)
                  print(f'OK: {current:.2f}% >= {baseline:.2f}%')
                  "

            # Baseline write: only on push to main (i.e. after a PR merges
            # to the release branch), never from a PR run. Cache keys are
            # immutable once written, so we delete the old entry first
            # (`|| true` since "no such key yet" is expected on the very
            # first run) then save the fresh one under the same stable key.
            - name: Update coverage baseline (main only)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "{\"line_pct\": ${{ steps.coverage.outputs.line_pct }}}" > coverage-baseline-android.json
                  gh cache delete coverage-baseline-android-v1 --repo "${{ github.repository }}" || true

            - name: Save coverage baseline (main only)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: coverage-baseline-android.json
                  key: coverage-baseline-android-v1

            - name: Upload Jacoco coverage report
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: android-jacoco-report
                  path: packages/catalyst-core/src/native/androidProject/app/build/reports/jacoco/jacocoTestReport
                  retention-days: 14

    test-ios-unit:
        needs: detect-changes
        if: needs.detect-changes.outputs.ios == 'true'
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            # CatalystCoreLogic (#432): the UIKit-free nested SPM package
            # split out of CatalystCore. Runs first, in the same job/runner
            # as the simulator-based tests below rather than as a separate
            # top-level job -- a separate job would mean a second macos
            # runner spin-up (real wall-clock cost on GitHub's macOS
            # runners) just to save ~50s, which doesn't pay for itself.
            # Sequencing it first here means a CatalystCoreLogic failure
            # fails fast and skips the expensive simulator boot + full
            # UIKit build below (~9-10 min) entirely -- that's the actual
            # win, not parallelism. No simulator boot, no full
            # CatalystCore/UIKit build, no network package resolution
            # (CatalystCoreLogic has zero dependencies). Measured locally:
            # 171 tests in well under a second (excluding cold build time).
            #
            # NOTE: this does not yet feed the coverage regression gate --
            # unlike jacoco on Android, there's no llvm-cov percentage
            # extraction wired up here. Tracked as a follow-up if/when
            # iOS coverage should join the same baseline-gate mechanism.
            - name: Run CatalystCoreLogic unit tests (swift test, no simulator)
              working-directory: packages/catalyst-core/src/native/iosnativeWebView
              run: |
                  set -o pipefail
                  swift test --package-path CoreLogic

            # Cache resolved SPM packages (AppAuth, GoogleSignIn, etc.)
            # keyed on Package.resolved -- avoids re-fetching them from
            # GitHub over the network on every run. Not full DerivedData
            # caching (fragile across CI runs -- bakes in absolute paths
            # and relies on mtimes actions/cache doesn't preserve), just
            # the downloaded package sources/checkouts.
            - name: Cache SPM packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: packages/catalyst-core/src/native/iosnativeWebView/.spm-cache
                  key: spm-${{ runner.os }}-${{ hashFiles('packages/catalyst-core/src/native/iosnativeWebView/Package.resolved') }}
                  restore-keys: |
                      spm-${{ runner.os }}-

            # Pick an available iPhone simulator at run time instead of
            # hardcoding a device name: GitHub only keeps a small,
            # rotating set of preinstalled simulators (~3 runtimes, and
            # the device lineup itself moves too -- "iPhone 16" was on
            # that set when this job was first written, then wasn't by
            # the time it actually ran, breaking the hardcoded version).
            #
            # Uses `xcrun simctl list devices available -j` instead of
            # `xcodebuild -showdestinations`: the latter has to load the
            # Xcode project and can trigger SPM package resolution before
            # it prints anything, so on a cold SPM cache it can stall for
            # 30s+ and (with output piped through `2>/dev/null`) fail
            # with no visible reason. simctl talks only to CoreSimulator
            # -- no project load, no package resolution -- and returns
            # structured JSON instead of text scraped with grep/sed.
            - name: Pick an available iOS simulator
              id: sim
              run: |
                  set -o pipefail
                  # Filter to available iPhone simulators, excluding
                  # "e"-suffixed models (iPhone 16e, 17e, ...) -- the
                  # budget/economy line. One picked in an earlier CI run
                  # took >2 minutes just to connect over lockdown and
                  # then still failed loading the UI test bundle;
                  # standard models haven't shown that flakiness here.
                  # Prefer the newest iOS runtime available, then the
                  # first matching device within it.
                  RESULT=$(xcrun simctl list devices available -j | jq -r '
                    .devices
                    | to_entries
                    | map(select(.key | test("com\\.apple\\.CoreSimulator\\.SimRuntime\\.iOS")))
                    | sort_by(.key) | reverse
                    | map(.value | map(select(.name | test("^iPhone( [0-9]+)?$|^iPhone [0-9]+ ")) | select(.name | test("[0-9]+e( |$)") | not)))
                    | flatten
                    | .[0]
                    | if . == null then "" else (.udid + "\t" + .name) end
                  ')
                  if [ -z "$RESULT" ]; then
                    echo "::error::No available iOS Simulator with an iPhone destination found on this runner"
                    xcrun simctl list devices available
                    exit 1
                  fi
                  UDID=$(echo "$RESULT" | cut -f1)
                  NAME=$(echo "$RESULT" | cut -f2)
                  echo "id=$UDID" >> "$GITHUB_OUTPUT"
                  echo "Selected simulator: $NAME ($UDID)"

            # Boot the simulator explicitly and wait for it to be fully
            # ready before xcodebuild runs any tests against it. Without
            # this, the cold boot happens implicitly inside the
            # `xcodebuild test` step (locally this is the "Simulator.app
            # opening" you see; headlessly on the CI runner it's the
            # same cost, just invisible) -- folding it into the test step
            # hides how much of the job's wall-clock time is boot vs.
            # actual test execution. Not `erase`-ing first: the runner
            # is a fresh ephemeral VM already, so erase only adds time
            # without changing anything.
            - name: Boot iOS simulator
              run: |
                  xcrun simctl boot "${{ steps.sim.outputs.id }}"
                  xcrun simctl bootstatus "${{ steps.sim.outputs.id }}" -b

            # CODE_SIGNING_ALLOWED=NO skips signing entirely -- there's no
            # device to install a signed build on, only the simulator.
            # -only-testing:iosnativeWebViewTests scopes the run to the
            # Tier 1 unit test target only -- the scheme also carries
            # iosnativeWebViewUITests, which is real-device/simulator
            # instrumented UI testing (Tier 2, explicitly out of scope
            # for #414) and failed to even load its bundle in CI.
            #
            # -parallel-testing-enabled is deliberately OFF: it caused
            # two pre-existing, timing-sensitive tests (a permission
            # callback wait, a concurrent-logging expectation -- neither
            # touched by this change) to flake under CPU contention from
            # multiple simulator clones on a shared CI runner, without
            # actually delivering the speed win it's meant to (16-25 min
            # in CI either way, vs ~91s measured locally without it).
            - name: Run iosnativeWebViewTests (Tier 1 XCTest unit tests)
              working-directory: packages/catalyst-core/src/native/iosnativeWebView
              run: |
                  set -o pipefail
                  # --quieter (-qq): only print tasks with errors. Test
                  # failures still surface -- xcbeautify never silences
                  # those regardless of quiet level -- this only cuts the
                  # per-file "Compiling"/per-test "✔" noise that was
                  # dominating this step's log output.
                  xcodebuild test \
                    -project iosnativeWebView.xcodeproj \
                    -scheme iosnativeWebView \
                    -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
                    -only-testing:iosnativeWebViewTests \
                    -clonedSourcePackagesDirPath .spm-cache \
                    CODE_SIGNING_ALLOWED=NO \
                    | xcbeautify --renderer github-actions --quieter

    docs:
        needs: detect-changes
        if: needs.detect-changes.outputs.docs == 'true'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"

            - name: Build Docs
              run: |
                  node -v
                  npm --prefix docs ci
                  cp docs/config_template.json docs/config.json
                  npm run docs:build
