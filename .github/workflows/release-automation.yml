name: Release Automation

on:
    workflow_dispatch:
        inputs:
            version:
                description: "catalyst-core version"
                required: true
                type: string
            npm_tag:
                description: "npm dist-tag"
                required: true
                type: choice
                options:
                    - beta
                    - latest
                    - canary
            pr_number:
                description: "PR number used for release notes, resolved from commit_sha when empty"
                required: false
                type: string
                default: ""
            commit_sha:
                description: "Commit SHA, optional"
                required: false
                type: string
                default: ""
            previous_sha:
                description: "Previous release commit SHA, optional; notes cover previous_sha...commit_sha"
                required: false
                type: string
                default: ""
    workflow_call:
        inputs:
            version:
                required: true
                type: string
            npm_tag:
                required: true
                type: string
            pr_number:
                required: false
                type: string
                default: ""
            commit_sha:
                required: false
                type: string
                default: ""
            previous_sha:
                required: false
                type: string
                default: ""

permissions:
    contents: read
    id-token: write
    pull-requests: read

jobs:
    trigger:
        runs-on: ubuntu-latest
        steps:
            - name: Trigger release automation service
              env:
                  VERSION: ${{ inputs.version }}
                  NPM_TAG: ${{ inputs.npm_tag }}
                  PR_NUMBER_INPUT: ${{ inputs.pr_number }}
                  COMMIT_SHA_INPUT: ${{ inputs.commit_sha }}
                  PREVIOUS_SHA: ${{ inputs.previous_sha }}
                  RELEASE_AUTOMATION_URL: https://stagcatalyst.1mg.com/release-automation/release-requests
                  GH_TOKEN: ${{ github.token }}
              run: |
                  COMMIT_SHA="$COMMIT_SHA_INPUT"
                  if [ -z "$COMMIT_SHA" ]; then
                    COMMIT_SHA="$GITHUB_SHA"
                  fi

                  PR_NUMBER="$PR_NUMBER_INPUT"
                  if [ -z "$PR_NUMBER" ]; then
                    PR_NUMBER=$(gh api \
                      -H "Accept: application/vnd.github+json" \
                      "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
                      --jq '.[0].number // ""' 2>/dev/null || true)
                  fi

                  if [ -z "$PR_NUMBER" ]; then
                    echo "::error::Could not resolve pull request number. Provide pr_number when running this workflow manually."
                    exit 1
                  fi

                  if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
                    echo "::error::pr_number must be a number (got '$PR_NUMBER')"
                    exit 1
                  fi
                  if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "::error::commit_sha must be a full 40-character sha (got '$COMMIT_SHA')"
                    exit 1
                  fi
                  if [ -n "$PREVIOUS_SHA" ] && ! [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "::error::previous_sha must be empty or a full 40-character sha (got '$PREVIOUS_SHA')"
                    exit 1
                  fi

                  OIDC_RESPONSE=$(curl --fail-with-body -sS \
                    -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=catalyst-release-automation")
                  OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value')

                  if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" == "null" ]; then
                    echo "::error::Could not fetch GitHub OIDC token"
                    exit 1
                  fi

                  PAYLOAD=$(jq -n \
                    --arg repo "$GITHUB_REPOSITORY" \
                    --arg packageName "catalyst-core" \
                    --arg version "$VERSION" \
                    --arg npmTag "$NPM_TAG" \
                    --arg prNumber "$PR_NUMBER" \
                    --arg commitSha "$COMMIT_SHA" \
                    --arg tagName "catalyst-core@$VERSION" \
                    --arg previousSha "$PREVIOUS_SHA" \
                    '{
                      repo: $repo,
                      packageName: $packageName,
                      version: $version,
                      npmTag: $npmTag,
                      prNumber: $prNumber,
                      commitSha: $commitSha,
                      tagName: $tagName
                    } + (if $previousSha != "" then { previousSha: $previousSha } else {} end)')

                  if ! RESPONSE=$(curl --fail-with-body -sS -X POST "$RELEASE_AUTOMATION_URL" \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer $OIDC_TOKEN" \
                    -d "$PAYLOAD"); then
                    echo "::error::release automation request failed"
                    echo "$RESPONSE"
                    exit 1
                  fi
                  echo "$RESPONSE"

                  {
                    echo "- Release notes requested for catalyst-core@$VERSION ($NPM_TAG)"
                    if [ -n "$PREVIOUS_SHA" ]; then
                      echo "- Changes: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_SHA...$COMMIT_SHA"
                    else
                      echo "- From PR #$PR_NUMBER"
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"
